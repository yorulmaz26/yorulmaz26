plugins {
    id 'com.android.application'
}

android {
    namespace 'com.golgen.oyun'
    compileSdk 35

    defaultConfig {
        applicationId 'com.golgen.oyun'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Yerel/CI kurulumu için debug anahtarıyla imzalanır; mağaza yayını için kendi keystore'unuzu tanımlayın.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
        htmlReport true
        textReport true
        textOutput file("$buildDir/reports/lint-results.txt")
    }

    testOptions {
        unitTests.all {
            testLogging {
                events 'passed', 'failed', 'skipped'
                exceptionFormat 'full'
            }
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
