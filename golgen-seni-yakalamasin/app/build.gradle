plugins {
    id 'com.android.application'
}

android {
    namespace 'com.golgen.oyun'
    compileSdk 36

    defaultConfig {
        applicationId 'com.golgen.oyun'
        minSdk 26
        // Google Play: 31 Ağustos 2026'dan itibaren yeni uygulama ve güncellemeler API 36 hedeflemeli
        targetSdk 36
        versionCode 2
        versionName '1.1.0'
        // Yalnızca desteklenen 6 dilin kaynakları paketlenir (kütüphanelerin diğer dilleri APK'yı şişirmez)
        resourceConfigurations += ['tr', 'en', 'de', 'it', 'fr', 'es']

        // ---- Reklam kimlikleri ----
        // Varsayılanlar Google'ın resmî TEST kimlikleridir (gerçek gelir getirmez, hesap riski yoktur).
        // Yayın için gradle.properties veya komut satırından verin, örn:
        //   ./gradlew assembleRelease -PadmobAppId=ca-app-pub-XXX~YYY -PadmobBannerId=ca-app-pub-XXX/ZZZ ...
        manifestPlaceholders = [admobAppId: (project.findProperty('admobAppId') ?: 'ca-app-pub-3940256099942544~3347511713')]
        buildConfigField 'String', 'ADMOB_BANNER_ID', "\"${project.findProperty('admobBannerId') ?: 'ca-app-pub-3940256099942544/9214589741'}\""
        buildConfigField 'String', 'ADMOB_INTERSTITIAL_ID', "\"${project.findProperty('admobInterstitialId') ?: 'ca-app-pub-3940256099942544/1033173712'}\""
        buildConfigField 'String', 'ADMOB_REWARDED_ID', "\"${project.findProperty('admobRewardedId') ?: 'ca-app-pub-3940256099942544/5224354917'}\""
    }

    buildFeatures {
        buildConfig true
    }

    // Play Console'a yükleme anahtarı: gradle.properties veya komut satırından verilirse kullanılır
    // (-PuploadStoreFile=... -PuploadStorePassword=... -PuploadKeyAlias=... -PuploadKeyPassword=...).
    // Anahtar ve şifreler depoya KONULMAZ. Verilmezse release debug anahtarıyla imzalanır (yalnızca doğrudan kurulum için).
    signingConfigs {
        upload {
            if (project.hasProperty('uploadStoreFile')) {
                storeFile file(project.property('uploadStoreFile'))
                storePassword project.property('uploadStorePassword')
                keyAlias project.property('uploadKeyAlias')
                keyPassword project.property('uploadKeyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Yerel/CI kurulumu için debug anahtarıyla imzalanır; mağaza yayını için kendi keystore'unuzu tanımlayın.
            signingConfig project.hasProperty('uploadStoreFile') ? signingConfigs.upload : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
        htmlReport true
        textReport true
        textOutput file("$buildDir/reports/lint-results.txt")
    }

    testOptions {
        unitTests.all {
            testLogging {
                events 'passed', 'failed', 'skipped'
                exceptionFormat 'full'
            }
        }
    }
}

dependencies {
    // Google AdMob (banner, geçiş, ödüllü video) ve AB/İngiltere için gizlilik onayı (UMP)
    implementation 'com.google.android.gms:play-services-ads:23.6.0'
    implementation 'com.google.android.ump:user-messaging-platform:3.1.0'
    testImplementation 'junit:junit:4.13.2'
}
