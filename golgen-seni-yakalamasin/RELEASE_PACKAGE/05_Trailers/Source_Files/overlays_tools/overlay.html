<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:R;font-weight:900;src:url(../fonts/Roboto-900.ttf)}
@font-face{font-family:R;font-weight:700;src:url(../fonts/Roboto-700.ttf)}
@font-face{font-family:R;font-weight:500;src:url(../fonts/Roboto-500.ttf)}
html,body{margin:0;width:100%;height:100%;background:transparent;font-family:R;overflow:hidden}
.cap{position:absolute;left:50%;transform:translateX(-50%);text-align:center;color:#fff;font-weight:900;
 background:rgba(10,16,28,.72);border:3px solid rgba(109,93,251,.7);border-radius:999px;padding:.38em .9em;white-space:nowrap;
 box-shadow:0 0 40px rgba(109,93,251,.45);text-shadow:0 0 18px rgba(109,93,251,.7)}
.cap.hz{left:6%;transform:none;text-align:left;border-radius:34px;white-space:normal;width:24%}
.end{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.big{font-weight:900;color:#fff;line-height:.95;position:relative;white-space:nowrap;text-shadow:0 0 .18em rgba(109,93,251,.75),0 0 .5em rgba(109,93,251,.45)}
.big .t{color:#20B8A6;text-shadow:0 0 .25em rgba(32,184,166,.6)}
.echo{position:absolute;left:0;top:0;transform:translate(-.05em,.06em);color:transparent!important;-webkit-text-stroke:.02em rgba(148,136,255,.55);text-shadow:none;z-index:-1}
.mid{font-weight:700;color:#20B8A6;letter-spacing:.06em;margin-top:.15em;text-shadow:0 0 .25em rgba(32,184,166,.55)}
.small{font-weight:700;color:#9488FF;letter-spacing:.24em;margin-top:.8em}
.line{font-weight:700;color:#fff;margin-top:1.1em;background:rgba(109,93,251,.85);padding:.35em 1em;border-radius:999px;box-shadow:0 0 40px rgba(109,93,251,.6)}
.line.plain{background:none;box-shadow:none;color:#D8DEF0;font-weight:500}
.mls{position:absolute;bottom:6%;width:100%;text-align:center;color:#AEB8D6;font-weight:700;letter-spacing:.28em}
</style></head><body><div id="root"></div>
<script>
const q=new URLSearchParams(location.search), mode=q.get('mode'), t=q.get('t')||'', hz=q.get('hz')==='1', lang=q.get('lang')||'en';
const W=innerWidth, H=innerHeight, u=Math.min(W,H)/1080;
const root=document.getElementById('root');
if(mode==='caption'){
  const fs=(hz?58:66)*u;
  root.innerHTML=`<div class="cap ${hz?'hz':''}" style="font-size:${fs}px;top:${hz?H*0.36:H*0.205}px">${t}</div>`;
  const c=root.firstChild; let s=fs; while(!hz && c.offsetWidth>W*0.92 && s>30){s-=2;c.style.fontSize=s+'px'}
} else if(mode==='deco'){
  // yatay video: kenarlarda koyu-lacivert geçiş + sağ panelde marka (siyah kenarlık yerine tasarım)
  const logo = lang==='tr'
   ? `<div class="big" style="font-size:${92*u}px"><span class="echo">GÖLGEN</span>GÖLGEN</div><div class="mid" style="font-size:${38*u}px">SENİ YAKALAMASIN</div><div class="small" style="font-size:${20*u}px">DOPPELGLOW</div>`
   : `<div class="big" style="font-size:${74*u}px"><span class="echo">DOPPELGLOW</span>DOPPEL<span class="t">GLOW</span></div><div class="small" style="font-size:${17*u}px;letter-spacing:.16em">GÖLGEN SENİ YAKALAMASIN</div>`;
  root.innerHTML=`<div style="position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,16,40,.55) 0%,rgba(10,16,40,0) 30%,rgba(10,16,40,0) 70%,rgba(10,16,40,.55) 100%)"></div>
  <div style="position:absolute;right:4%;width:26%;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center">${logo}</div>`;
} else {
  const cta=/!|¡/.test(t) && !/^(Gölgen|Doppel)/.test(t);
  const logo = lang==='tr'
   ? `<div class="big" style="font-size:${150*u}px"><span class="echo">GÖLGEN</span>GÖLGEN</div><div class="mid" style="font-size:${62*u}px">SENİ YAKALAMASIN</div><div class="small" style="font-size:${30*u}px">DOPPELGLOW</div>`
   : `<div class="big" style="font-size:${128*u}px"><span class="echo">DOPPELGLOW</span>DOPPEL<span class="t">GLOW</span></div><div class="small" style="font-size:${28*u}px;letter-spacing:.16em">GÖLGEN SENİ YAKALAMASIN</div>`;
  root.innerHTML=`<div class="end"><img src="../brand/icon_512_test.png" style="width:${230*u}px;height:${230*u}px;border-radius:${50*u}px;margin-bottom:${50*u}px;box-shadow:0 0 ${60*u}px rgba(32,184,166,.45)">${logo}<div class="line ${cta?'':'plain'}" style="font-size:${46*u}px">${t}</div></div><div class="mls" style="font-size:${26*u}px">MAGIC LUMOS SOFTWARE</div>`;
}
</script></body></html>
