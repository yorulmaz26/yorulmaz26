<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:R;font-weight:900;src:url(../fonts/Roboto-900.ttf)}
@font-face{font-family:R;font-weight:700;src:url(../fonts/Roboto-700.ttf)}
@font-face{font-family:R;font-weight:500;src:url(../fonts/Roboto-500.ttf)}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:R;background:#0A101C}
.bg{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(14px) saturate(1.3) brightness(.45)}
.grid{position:absolute;inset:0;background-image:linear-gradient(#2C3A5E44 2px,transparent 2px),linear-gradient(90deg,#2C3A5E44 2px,transparent 2px);background-size:80px 80px;opacity:.5}
.wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:4%}
.col{display:flex;flex-direction:column;align-items:center;text-align:center;z-index:2}
.big{font-weight:900;color:#fff;line-height:.95;position:relative;white-space:nowrap;text-shadow:0 0 .18em rgba(109,93,251,.75)}
.big .t{color:#20B8A6;text-shadow:0 0 .25em rgba(32,184,166,.6)}
.echo{position:absolute;left:0;top:0;transform:translate(-.05em,.06em);color:transparent!important;-webkit-text-stroke:.02em rgba(148,136,255,.55);text-shadow:none;z-index:-1}
.mid{font-weight:700;color:#20B8A6;letter-spacing:.06em;margin-top:.15em}
.small{font-weight:700;color:#9488FF;letter-spacing:.22em;margin-top:.7em}
.tag{font-weight:700;color:#fff;margin-top:.9em;line-height:1.2}
.cta{margin-top:1em;font-weight:900;color:#fff;background:linear-gradient(135deg,#9488FF,#4B3FD0);padding:.45em 1.3em;border-radius:999px;box-shadow:0 0 50px rgba(109,93,251,.6)}
.phone{border-radius:6%/3.4%;overflow:hidden;box-shadow:0 0 0 6px #2C3A5E,0 0 90px rgba(109,93,251,.45);z-index:2;flex:none}
.phone img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.mls{position:absolute;bottom:3.2%;width:100%;text-align:center;color:#AEB8D6;font-weight:700;letter-spacing:.28em;z-index:2}
</style></head><body><div class="bg" id="bg"></div><div class="grid"></div><div class="wrap" id="wrap"></div><div class="mls" id="mls">MAGIC LUMOS SOFTWARE</div>
<script>
const q=new URLSearchParams(location.search), lang=q.get('lang'), W=innerWidth, H=innerHeight, u=Math.min(W,H)/1080;
document.getElementById('bg').style.backgroundImage=`url("${q.get('img')}")`;
document.getElementById('mls').style.fontSize=(22*u)+'px';
const landscape=W/H>1.3, tall=H/W>1.5;
const s=(landscape?0.85:(tall?1.15:0.95))*u;
const logo = lang==='tr'
 ? `<div class="big" style="font-size:${130*s}px"><span class="echo">GÖLGEN</span>GÖLGEN</div><div class="mid" style="font-size:${54*s}px">SENİ YAKALAMASIN</div><div class="small" style="font-size:${26*s}px">DOPPELGLOW</div>`
 : `<div class="big" style="font-size:${112*s}px"><span class="echo">DOPPELGLOW</span>DOPPEL<span class="t">GLOW</span></div><div class="small" style="font-size:${24*s}px;letter-spacing:.16em">GÖLGEN SENİ YAKALAMASIN</div>`;
const tag=q.get('tag')||'', cta=q.get('cta')||'';
const col=`<div class="col">${logo}<div class="tag" style="font-size:${46*s}px;max-width:${landscape?W*0.42:W*0.86}px">${tag}</div>${cta?`<div class="cta" style="font-size:${44*s}px">${cta}</div>`:''}</div>`;
const ph=landscape?H*0.82:(tall?H*0.5:H*0.52);
const phone=`<div class="phone" style="height:${ph}px;width:${ph*9/16}px"><img src="${q.get('shot')}"></div>`;
const wrap=document.getElementById('wrap');
if(landscape){wrap.innerHTML=col+phone;}
else {wrap.style.flexDirection='column';wrap.style.gap=(tall?60:40)*u+'px';wrap.innerHTML=col+phone;}
</script></body></html>
