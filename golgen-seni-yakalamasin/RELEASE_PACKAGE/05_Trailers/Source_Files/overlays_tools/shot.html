<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:R;font-weight:900;src:url(../fonts/Roboto-900.ttf)}
@font-face{font-family:R;font-weight:700;src:url(../fonts/Roboto-700.ttf)}
@font-face{font-family:R;font-weight:500;src:url(../fonts/Roboto-500.ttf)}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;font-family:R}
body{background:linear-gradient(180deg,#141D3A 0%,#0C1226 45%,#070B16 100%);position:relative}
.grid{position:absolute;inset:0;background-image:linear-gradient(#2C3A5E55 2px,transparent 2px),linear-gradient(90deg,#2C3A5E55 2px,transparent 2px);background-size:90px 90px;opacity:.35;mask-image:linear-gradient(180deg,#000 0%,transparent 70%);-webkit-mask-image:linear-gradient(180deg,#000 0%,transparent 70%)}
.blob{position:absolute;border-radius:50%;filter:blur(90px)}
.cap{position:absolute;left:60px;right:60px;top:88px;text-align:center}
.h{font-weight:900;color:#fff;font-size:84px;line-height:1.02;letter-spacing:-.005em;text-shadow:0 0 28px rgba(109,93,251,.6)}
.h b{color:#20B8A6;font-weight:900;text-shadow:0 0 26px rgba(32,184,166,.55)}
.s{margin-top:22px;font-weight:500;color:#AEB8D6;font-size:42px;line-height:1.2}
.phone{position:absolute;left:50%;top:420px;width:820px;height:1458px;transform:translateX(-50%);border-radius:54px;overflow:hidden;
 box-shadow:0 0 0 7px #2C3A5E,0 0 0 9px #6D5DFB66,0 30px 90px rgba(0,0,0,.6),0 0 120px rgba(109,93,251,.35)}
.phone img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.brand{position:absolute;bottom:20px;width:100%;text-align:center;color:#55618A;font-weight:700;font-size:24px;letter-spacing:.3em}
</style></head><body>
<div class="grid"></div>
<div class="blob" style="width:520px;height:520px;left:-160px;top:180px;background:#6D5DFB;opacity:.35"></div>
<div class="blob" style="width:480px;height:480px;right:-160px;top:40px;background:#20B8A6;opacity:.25"></div>
<div class="cap"><div class="h" id="h"></div><div class="s" id="s"></div></div>
<div class="phone"><img id="img"></div>
<script>
const q=new URLSearchParams(location.search);
// başlıktaki *vurgu* kelimesi turkuaz yapılır
document.getElementById('h').innerHTML=(q.get('h')||'').replace(/\*([^*]+)\*/g,'<b>$1</b>');
document.getElementById('s').textContent=q.get('s')||'';
document.getElementById('img').src=q.get('img');
// başlık 2 satırı geçerse küçült
const H=document.getElementById('h'); let fs=84; while(H.scrollHeight>2*fs*1.05+4 && fs>56){fs-=2;H.style.fontSize=fs+'px'}
const S=document.getElementById('s'); let ss=42; while(S.scrollHeight>2*ss*1.22+4 && ss>30){ss-=1;S.style.fontSize=ss+'px'}
</script></body></html>
