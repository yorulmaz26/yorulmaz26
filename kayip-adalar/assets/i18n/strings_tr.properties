tutorial.SLIDE=Adaya dokun ve ok yönünde kaydır. Bağlantı noktaları karşılıklı gelince köprü kurulur!
tutorial.ROTATE=Adayı seç ve "Döndür" ile 90° çevir. Köprü uçlarını birbirine hizala.
tutorial.BRIDGES=Sabit adalar köprü zincirinin parçasıdır. Hedef adaya giden yolu tamamla.
tutorial.FOG=Bulutlu adalar gizlidir. Kale ağını yanlarına uzatınca ortaya çıkarlar.
tutorial.FIRE_WATER=Su ve ateşi bağla: Buhar Bulutu kombosu oluşur. Ateşi ormana bağlarsan orman yanar!
tutorial.ICE=Donmuş adalar hareket edemez. Bir ateş adasını köprüyle bağlayarak erit.
tutorial.WIND=Rüzgâr oklu karelere giren adalar rüzgâr yönünde sürüklenir. Bunu lehine kullan!
tutorial.CRYSTAL_ENERGY=Kristaller enerji üretir. Enerjiyle adaları yükselt veya alçalt; yükseklik farkı 1'den fazlaysa köprü kurulmaz.
tutorial.PORTAL=İki portalı da köprüyle enerjilendir: uzak adalar birbirine bağlanır.
tutorial.FORT_BATTLE=Birlikler köprüler üzerinden ilerler. Birliğin olduğu adayı seç, "Birlik" ile hedefe gönder.
tutorial.SWAP=Takas ile iki komşu adanın yerini değiştir (1 enerji). Birleştir ile iki adayı tek parça yapıp birlikte kaydırabilirsin; Ayır ile çözersin.
tutorial.DEFENSIVE_AI=Savunmacı düşmanlar üslerini korur. Onları kombolarla zayıflat.
tutorial.JUMP=Sıçrat ile ada iki kare atlar (2 enerji).
tutorial.GRAVITY=Yerçekimi adası her tur aynı sıradaki adaları kendine çeker.
tutorial.CRUMBLE=Sayaçlı adalar sıfıra inince çöker. Kaçış kapısına hızla yol kur!
tutorial.TRADE=Ticaret adasını farklı üreticilerle aynı ağa bağla.
tutorial.TRAPPER_AI=Tuzakçı düşman köprülerini çevirir ve adalarını kilitler. Ağını yedekli kur.
tutorial.POISON=Zehir adası bağlı adalardaki tüm birliklere hasar verir. Düşmanı zehre bağla!
tutorial.TIME=Zaman adası kaleye bağlanınca ek hamle verir.
tutorial.ELECTRIC=Elektrik ve suyu bağla: Elektrikli Alan düşmanlara hasar verir.
tutorial.VOLCANO=Volkan güçlüdür ama birliklerine de zarar verir. Su ile obsidyene çevirebilirsin.
tutorial.RESOURCER_AI=Kaynakçı düşman üretim adalarına bağlıyken yeni asker üretir. Bağlantısını kes!
tutorial.LIFE=Yaşam adası birliklerini ve kaleni iyileştirir.
tutorial.STRATEGIST_AI=Stratejist düşman tehlikeyi hesaplar. Onu köşeye sıkıştır.
tutorial.ANCIENT=Kadim ada nadir güçler verir ve patronları zayıflatır.

