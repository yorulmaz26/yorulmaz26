islandDesc.CASTLE=Krallığının kalbi. Tüm üretim ve görevler kaleye bağlı ağ üzerinden işler.
islandDesc.FOREST=Kaleye bağlıyken her tur odun üretir. Su adasına bağlıysa üretim iki katına çıkar. Ateşe bağlanırsa yanar!
islandDesc.MINE=Kaleye bağlıyken taş üretir. Ateşle birleşince demir döker.
islandDesc.FARM=Kaleye bağlıyken yiyecek üretir. Yaşam adasıyla bereketli hasat verir.
islandDesc.WATER=Yangınları önler, ormanları hızlandırır. Ateş, buz ve elektrikle güçlü kombolar kurar.
islandDesc.FIRE=Donmuş adaları eritir. Suyla buhar, rüzgârla alev fırtınası oluşturur. Yanındaki ormanları yakar.
islandDesc.ICE=Üzerindeki düşmanları yavaşlatır. Suyla donmuş geçit kurar.
islandDesc.WIND=Rüzgâr hücreleri adaları sürükler. Ateş ve zehirle saldırı kombosu kurar.
islandDesc.ELECTRIC=Suyla elektrikli alan oluşturup düşmanlara hasar verir.
islandDesc.CRYSTAL=Kaleye bağlıyken her tur ada enerjisi üretir. Patron mühürlerini oluşturur.
islandDesc.MILITARY=Üzerindeki birlikler +1 saldırı kazanır.
islandDesc.FORT=Üzerindeki birlikler +2 savunma kazanır.
islandDesc.TRADE=Ağda başka üretici varken altın üretir. Ticaret yollarının merkezi.
islandDesc.POISON=Bağlı adalardaki tüm birliklere her tur hasar verir. Dikkatli kullan!
islandDesc.FOG=Kaleye bağlıyken çevresindeki gizli adaları açığa çıkarır.
islandDesc.TIME=Kaleye ilk bağlandığında ek hamle kazandırır.
islandDesc.GRAVITY=Her tur aynı sıradaki adaları kendine doğru bir kare çeker.
islandDesc.PORTAL=Enerjili (en az bir köprüsü olan) portallar birbirine uzaktan bağlanır.
islandDesc.VOLCANO=Her üç turda bir patlar ve bağlı adalardaki tüm birliklere hasar verir.
islandDesc.LIFE=Bağlı birlikleri iyileştirir, kaleyi onarır.
islandDesc.ANCIENT=İlk bağlandığında enerji verir, birlikleri tamamen iyileştirir ve patronu zayıflatır.
islandDesc.VILLAGE=Kaleye bağlandığında halkı kurtarılır.
islandDesc.EXIT=Çöken adalardan kaçış noktası.
islandDesc.ENEMY_FORT=Düşman birliklerinin üssü. Bir birliğini üzerine taşıyarak ele geçir.
islandDesc.BURNT=Yanmış ve üretimi bitmiş ada. Köprüsü hâlâ kullanılabilir.

