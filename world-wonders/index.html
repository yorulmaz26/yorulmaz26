<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>World Wonders</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0d2236">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Nunito:wght@500;700;800;900&display=swap">
<style>
/* Layout: tek ekranlı mobil oyun. Harita = zengin 3D keşif dünyası; Match-3 = sade, nötr tahta. */
:root{
  --ink:#10263b;          /* gece mavisi: harita gökyüzü, başlıklar */
  --ink-2:#1b3a57;
  --parch:#f5ecd9;        /* parşömen: kartlar */
  --parch-2:#e7dbc1;
  --gold:#e8b23a;         /* altın: ödül, vurgu */
  --gold-2:#b9831b;
  --terra:#c8592b;        /* kiremit: ikincil vurgu */
  --board:#d9d2c3;        /* nötr taş: Match-3 tahtası */
  --board-bg:#efe9de;
  --text:#2a2118;
  --muted:#7a6c58;
  --ok:#2f9d62;
  --bad:#c23b3b;
  --f-display:"Cinzel","Trajan Pro","Times New Roman",serif;
  --f-body:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--text);font-family:var(--f-body);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font-family:inherit;cursor:pointer;border:0}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{position:relative;height:100%;width:100%;overflow:hidden}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.active{display:flex}

/* ---------- ortak bileşenler ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border-radius:16px;font-weight:900;font-size:17px;letter-spacing:.02em;color:#3b2500;
  background:linear-gradient(#ffd977,#e8b23a 55%,#c88d1e);box-shadow:0 4px 0 #8f5f0e,0 8px 18px rgba(0,0,0,.25);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8f5f0e,0 4px 10px rgba(0,0,0,.25)}
.btn.alt{color:#fff;background:linear-gradient(#3f6f9c,#24496d);box-shadow:0 4px 0 #13283d,0 8px 18px rgba(0,0,0,.25)}
.btn.ghost{color:var(--ink);background:var(--parch-2);box-shadow:0 3px 0 #b9a985}
.btn.small{padding:9px 14px;font-size:14px;border-radius:12px}
.btn.wide{width:100%}
.iconbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;background:rgba(255,255,255,.14);font-size:20px;font-weight:900;backdrop-filter:blur(6px)}
.iconbtn.dark{background:rgba(16,38,59,.85)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:rgba(16,38,59,.72);color:#fff;font-weight:800;font-size:14px;backdrop-filter:blur(6px)}
.chip b{color:var(--gold)}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}

/* ---------- harita ---------- */
#mapScreen{background:radial-gradient(120% 80% at 50% 0%,#23507a 0%,#10263b 60%)}
.mapTop{position:absolute;z-index:5;top:0;left:0;right:0;padding:12px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));display:flex;align-items:flex-start;justify-content:space-between;gap:10px;pointer-events:none}
.mapTop>*{pointer-events:auto}
.brand h1{color:#fff;font-size:24px;letter-spacing:.06em;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.brand p{margin:2px 0 0;color:#cfe0f0;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.topStats{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
#mapView{position:absolute;inset:0;perspective:1100px;perspective-origin:50% 30%;overflow:hidden;touch-action:none;cursor:grab}
#mapView.dragging{cursor:grabbing}
#tilt{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(46deg);transform-origin:50% 55%}
#plane{position:absolute;left:0;top:0;transform-style:preserve-3d;border-radius:28px;
  background:radial-gradient(60% 50% at 30% 40%,#3a8fc0 0%,transparent 70%),radial-gradient(50% 60% at 75% 60%,#2f7fb3 0%,transparent 70%),linear-gradient(#1f6596,#174f7a);
  box-shadow:0 0 0 14px #0f3b5c,0 40px 80px rgba(0,0,0,.5)}
#plane .waves{position:absolute;inset:0;border-radius:28px;opacity:.22;background-image:radial-gradient(circle at 10px 10px,rgba(255,255,255,.7) 1.4px,transparent 2px);background-size:46px 34px;animation:waves 9s linear infinite}
@keyframes waves{to{background-position:46px 34px}}
#plane svg{position:absolute;inset:0;overflow:visible}
.cloud{position:absolute;width:180px;height:60px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.75),rgba(255,255,255,0));filter:blur(2px);transform-style:preserve-3d;animation:drift 40s linear infinite alternate;pointer-events:none}
@keyframes drift{from{margin-left:-60px}to{margin-left:60px}}
.pin{position:absolute;width:104px;margin-left:-52px;transform-origin:50% 100%;transform-style:preserve-3d;display:flex;flex-direction:column;align-items:center;cursor:pointer}
.pin canvas{width:104px;height:96px;filter:drop-shadow(0 6px 4px rgba(0,0,0,.35))}
.pin .lbl{margin-top:-2px;padding:3px 10px;border-radius:10px;background:var(--parch);color:var(--ink);font-weight:900;font-size:13px;white-space:nowrap;box-shadow:0 3px 0 #b9a985}
.pin .sub{font-size:11px;font-weight:800;color:#fff;margin-top:3px;text-shadow:0 1px 2px #000;white-space:nowrap}
.pin.locked canvas{filter:grayscale(1) brightness(.55) drop-shadow(0 6px 4px rgba(0,0,0,.35))}
.pin.locked .lbl{background:#9aa6b2;box-shadow:0 3px 0 #6b7784}
.pin.current .lbl{background:var(--gold);box-shadow:0 3px 0 var(--gold-2)}
.pin.current{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{margin-top:-8px}}
.pin.rise{animation:rise 1.4s cubic-bezier(.2,1.6,.4,1) both}
@keyframes rise{from{opacity:0;scale:.2}to{opacity:1;scale:1}}
.ring{position:absolute;width:90px;height:90px;margin:-45px 0 0 -45px;border-radius:50%;border:4px solid rgba(255,214,110,.9);box-shadow:0 0 22px rgba(255,214,110,.8);animation:ring 1.8s ease-out infinite;pointer-events:none}
@keyframes ring{from{scale:.3;opacity:1}to{scale:1.4;opacity:0}}
.ring.done{border-color:rgba(255,255,255,.55);box-shadow:none;animation:none;scale:.55;opacity:.7}
.mapPanel{position:absolute;z-index:5;left:0;right:0;bottom:0;padding:0 max(16px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.panelCard{pointer-events:auto;max-width:520px;margin:0 auto;background:var(--parch);border-radius:22px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 0 0 2px #fff6;display:grid;grid-template-columns:84px 1fr;gap:12px;align-items:center}
.panelCard canvas{width:84px;height:63px;border-radius:12px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.panelCard h2{font-size:19px;color:var(--ink)}
.panelCard .meta{font-size:13px;color:var(--muted);font-weight:800}
.pbar{height:10px;border-radius:6px;background:#d8cba9;overflow:hidden;margin-top:6px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,#ffd977,#e8b23a);border-radius:6px;transition:width .6s}
.panelBtns{grid-column:1/-1;display:grid;grid-template-columns:1fr auto auto;gap:8px}

/* ---------- oyun ekranı ---------- */
#gameScreen{background:linear-gradient(#f3eee5,#e6dfd2);align-items:center}
.hud{width:100%;max-width:540px;padding:10px max(12px,env(safe-area-inset-right,0px)) 6px max(12px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.hud .iconbtn{background:var(--ink);}
.lvlTitle{font-family:var(--f-display);font-weight:800;color:var(--ink);font-size:16px;line-height:1.1}
.lvlTitle small{display:block;font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:800;letter-spacing:.04em}
.moves{min-width:70px;text-align:center;background:var(--ink);color:#fff;border-radius:16px;padding:4px 10px 6px}
.moves b{display:block;font-size:28px;line-height:1;font-weight:900}
.moves span{font-size:10px;letter-spacing:.12em;font-weight:800;opacity:.8}
.moves.low b{color:#ff8c7a}
.goalsRow{width:100%;max-width:540px;padding:0 12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.goal{display:flex;align-items:center;gap:6px;padding:5px 12px 5px 6px;border-radius:14px;background:#fffaf0;box-shadow:0 2px 0 #d6ccb6;font-weight:900;color:var(--ink);font-size:17px;font-variant-numeric:tabular-nums}
.goal img{width:34px;height:34px}
.goal.done{background:#dff3e6;color:var(--ok)}
.subHud{width:100%;max-width:540px;padding:8px 14px 0;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:800;color:var(--muted);font-size:13px}
.score{font-variant-numeric:tabular-nums;color:var(--ink)}
.pieceProg{display:flex;align-items:center;gap:5px}
.pieceProg i{width:12px;height:12px;border-radius:4px;background:#d6ccb6;transform:rotate(45deg)}
.pieceProg i.on{background:var(--gold);box-shadow:0 0 6px var(--gold)}
.boardWrap{flex:1;width:100%;display:flex;align-items:center;justify-content:center;min-height:0;position:relative}
#board{touch-action:none;display:block}
.banner{position:absolute;left:50%;top:45%;translate:-50% -50%;width:min(92%,480px);text-align:center;font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1.15;color:#fff;text-shadow:0 3px 0 #b9831b,0 0 24px rgba(232,178,58,.9),0 0 3px #10263b;pointer-events:none;text-wrap:balance;animation:banner 1.3s ease both}
@keyframes banner{0%{scale:.3;opacity:0}20%{scale:1.1;opacity:1}80%{scale:1;opacity:1}100%{scale:1.2;opacity:0}}
.gameFoot{padding:0 0 max(10px,env(safe-area-inset-bottom,0px));min-height:14px;display:flex;gap:8px}

/* ---------- puzzle & koleksiyon ---------- */
.darkScreen{background:radial-gradient(120% 90% at 50% 0%,#2a4d6e,#0d2236 70%);color:#fff;align-items:center;overflow-y:auto}
.scrTop{width:100%;max-width:620px;padding:12px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:12px}
.scrTop h2{font-size:22px;flex:1}
.scrTop small{display:block;font-family:var(--f-body);font-weight:800;font-size:12px;color:#cfe0f0;letter-spacing:.1em;text-transform:uppercase}
.puzzleTray{position:relative;margin:8px auto 0;padding:14px;border-radius:22px;background:linear-gradient(#5b3a22,#3e2714);box-shadow:inset 0 0 0 3px #7a5232,0 18px 40px rgba(0,0,0,.45)}
.puzzleTray canvas{display:block;border-radius:10px;background:#2a1a0e}
.pInfo{width:100%;max-width:620px;padding:14px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.factCard{background:rgba(255,255,255,.08);border-radius:16px;padding:12px 14px;line-height:1.5;font-size:15px;color:#e6eef6}
.factCard b{color:var(--gold)}
.statRow{display:flex;justify-content:space-between;font-weight:800;color:#cfe0f0}
.statRow b{color:#fff}
.collGrid{width:100%;max-width:720px;padding:8px max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.collCard{background:rgba(255,255,255,.08);border-radius:16px;padding:8px;color:#fff;text-align:left;display:flex;flex-direction:column;gap:6px}
.collCard canvas{width:100%;aspect-ratio:4/3;border-radius:10px;max-width:100%}
.collCard b{font-size:15px}
.collCard span{font-size:12px;color:#cfe0f0;font-weight:800}
.collCard.done{box-shadow:inset 0 0 0 2px var(--gold)}
.collCard.soon{opacity:.6;justify-content:center;align-items:center;text-align:center;min-height:150px;border:2px dashed rgba(255,255,255,.3);background:transparent}

/* ---------- modal ---------- */
.modal{position:absolute;inset:0;z-index:50;display:grid;place-items:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));background:rgba(6,16,26,.62);backdrop-filter:blur(3px)}
.modal[hidden]{display:none!important}
.card{width:100%;max-width:400px;max-height:100%;overflow-y:auto;background:var(--parch);border-radius:24px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.5),inset 0 0 0 2px #fff7;animation:pop .32s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{scale:.7;opacity:0}}
.card h2{color:var(--ink);font-size:24px;text-align:center}
.card .kicker{text-align:center;font-weight:900;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--terra);margin-bottom:4px}
.card p{color:var(--text);line-height:1.5;margin:10px 0}
.card .thumb{display:block;width:100%;border-radius:16px;margin:12px 0;aspect-ratio:4/3;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.card .row{display:flex;gap:10px;margin-top:14px}
.card .row>*{flex:1}
.card .goalsRow{padding:0;margin:8px 0}
.stars{display:flex;justify-content:center;gap:6px;margin:10px 0;font-size:44px;line-height:1}
.stars span{color:#d6ccb6;text-shadow:0 2px 0 #b9a985}
.stars span.on{color:var(--gold);text-shadow:0 2px 0 var(--gold-2),0 0 16px rgba(232,178,58,.7);animation:starIn .5s cubic-bezier(.2,1.8,.4,1) both}
@keyframes starIn{from{scale:0;rotate:-90deg}}
.steps{display:grid;gap:8px;margin:12px 0}
.steps div{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;background:#fffaf0;border-radius:12px;padding:8px 10px;font-weight:700;font-size:14px}
.steps em{font-style:normal;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--ink);color:var(--gold);font-weight:900}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;border-bottom:1px solid #dccfb3;font-weight:800;color:var(--ink)}
.toggle small{display:block;font-weight:700;color:var(--muted);font-size:12px}
.sw{width:52px;height:30px;border-radius:16px;background:#c9bc9d;position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--ok)}.sw.on::after{left:25px}
.stoneList{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.stoneList div{display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:800;color:var(--muted);text-align:center}
.stoneList img{width:44px;height:44px}
#fxLayer{position:absolute;inset:0;z-index:60;pointer-events:none}
.tapLayer{position:absolute;inset:0;z-index:61;background:rgba(6,16,26,.35);display:flex;align-items:flex-end;justify-content:center;padding:0 16px max(9vh,calc(env(safe-area-inset-bottom,0px) + 24px))}
.tapLayer span{padding:12px 20px;border-radius:999px;background:var(--parch);color:var(--ink);font-weight:900;font-size:16px;box-shadow:0 6px 20px rgba(0,0,0,.4);animation:bob 1.4s ease-in-out infinite}
.deco{position:absolute;width:34px;height:40px;margin-left:-17px;transform-origin:50% 100%;transform-style:preserve-3d;pointer-events:none}
.deco canvas{width:34px;height:40px;filter:drop-shadow(0 3px 2px rgba(0,0,0,.35))}
.deco.pop{animation:decoPop 1s cubic-bezier(.2,1.8,.4,1) both}
@keyframes decoPop{from{scale:0;opacity:0}to{scale:1;opacity:1}}
.slot{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;border:2px dashed rgba(255,255,255,.55);pointer-events:none}
.hardTag{display:inline-block;padding:2px 9px;border-radius:999px;background:#c23b3b;color:#fff;font-family:var(--f-body);font-weight:900;font-size:11px;letter-spacing:.08em;vertical-align:middle}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div id="app">

  <!-- ===== HARİTA ===== -->
  <section id="mapScreen" class="screen active" aria-label="Dünya haritası">
    <div id="mapView"><div id="tilt"><div id="plane"><div class="waves"></div></div></div></div>
    <div class="mapTop">
      <div class="brand"><h1>World Wonders</h1><p>Yeni Dünyanın 7 Harikası</p></div>
      <div class="topStats">
        <span class="chip" id="lifeChip" title="Canlar">❤ <b id="lifeCount">3</b><small id="lifeTimer" style="font-weight:800;opacity:.8"></small></span>
        <span class="chip">★ <b id="starCount">0</b></span>
        <span class="chip">🏛 <b id="wonderCount">0</b>/7</span>
        <button class="iconbtn dark" id="btnSettings" aria-label="Ayarlar">⚙</button>
      </div>
    </div>
    <div class="mapPanel"><div class="panelCard" id="panelCard"></div></div>
  </section>

  <!-- ===== MATCH-3 ===== -->
  <section id="gameScreen" class="screen" aria-label="Bölüm">
    <div class="hud">
      <button class="iconbtn" id="btnQuit" aria-label="Haritaya dön">✕</button>
      <div class="lvlTitle" id="lvlTitle"></div>
      <div class="moves" id="movesBox"><b id="moves">0</b><span>HAMLE</span></div>
    </div>
    <div class="goalsRow" id="goals"></div>
    <div class="subHud">
      <span class="score">Puan <b id="score">0</b></span>
      <span class="pieceProg" id="pieceProg" title="Puzzle parçasına ilerleme"></span>
    </div>
    <div class="boardWrap" id="boardWrap"><canvas id="board"></canvas></div>
    <div class="gameFoot" id="gameFoot"></div>
  </section>

  <!-- ===== PUZZLE ===== -->
  <section id="puzzleScreen" class="screen darkScreen" aria-label="Puzzle">
    <div class="scrTop"><button class="iconbtn" id="btnPuzzleBack" aria-label="Geri">←</button><h2 id="pzTitle"></h2></div>
    <div class="puzzleTray"><canvas id="puzzle"></canvas></div>
    <div class="pInfo" id="pzInfo"></div>
  </section>

  <!-- ===== KOLEKSİYON ===== -->
  <section id="collectionScreen" class="screen darkScreen" aria-label="Koleksiyon">
    <div class="scrTop"><button class="iconbtn" id="btnCollBack" aria-label="Geri">←</button><h2>Koleksiyon<small>Tamamlanan dünya harikaları</small></h2></div>
    <div class="collGrid" id="collGrid"></div>
  </section>

  <div class="modal" id="modal" hidden><div class="card" id="modalCard"></div></div>
  <canvas id="fxLayer"></canvas>
</div>

<script>
"use strict";
/* =====================================================================
   WORLD WONDERS — oynanabilir prototip
   Kesin kararlar: 6 sabit taş, sade tahta, her 5 bölümde 1 puzzle parçası,
   parça yalnızca mevcut destinasyona gider, 7 harika sırası.
   Kesin: 12 parça/harika, 3 can (20 dk/can, parça kazanınca dolar), para ve güçlendirici yok
   ===================================================================== */
const PIECES_PER_WONDER = 12;            // kesin karar
const MAX_LIVES = 3;                     // kesin karar: 3 can, oyun içi para yok
const LIFE_REGEN_MS = 20 * 60 * 1000;    // karar: 20 dakikada 1 can yenilenir
// karar: puzzle parçası kazanınca canlar tamamen dolar · bölüm öncesi güçlendirici yok · gelir modeli şimdilik yok
const LEVELS_PER_PIECE = 5;              // kesin karar
const LEVELS_PER_WONDER = PIECES_PER_WONDER * LEVELS_PER_PIECE;
const ROWS = 8, COLS = 8;
const TAU = Math.PI * 2;

const STONES = [
  { id:'coin',    name:'Altın Sikke',     color:'#f4c430' },
  { id:'scroll',  name:'Antik Parşömen',  color:'#e8d6ad' },
  { id:'amphora', name:'Antik Amfora',    color:'#d0632e' },
  { id:'wreath',  name:'Defne Çelengi',   color:'#2fa36b' },
  { id:'compass', name:'Safir Pusula',    color:'#2f6fd6' },
  { id:'crown',   name:'Yakut Taç',       color:'#d4233a' },
];

const BLOCKS = {
  marble:    { name:'Mermer Blok',     hp:1 },
  brick:     { name:'Antik Duvar',     hp:2 },
  rock:      { name:'Kaya Bloğu',      hp:1 },
  rockHard:  { name:'Sert Kaya',       hp:2 },
  tajMarble: { name:'Mermer Engel',    hp:1 },
  inlay:     { name:'Dekoratif Taş',   hp:2 },
  wood:      { name:'Ahşap Bariyer',   hp:1 },
  stonewall: { name:'Taş Duvar',       hp:2 },
  granite:   { name:'Taş Blok',        hp:1 },
  seal:      { name:'Taş Mühür',       hp:3 },
  mountain:  { name:'Dağ Kayası',      hp:1 },
  granite2:  { name:'Granit Kaya',     hp:2 },
  shield:    { name:'Gladyatör Kalkanı', hp:1 },

   BÖLÜM ÜRETİMİ (tohumlu — her bölüm her oyuncuda aynı)

function makeLevel(g){
  const w = Math.min(WONDERS.length-1, Math.floor((g-1)/LEVELS_PER_WONDER)), li = (g-1)%LEVELS_PER_WONDER + 1, W = WONDERS[w];
  const rnd = mulberry32(g*7919 + 13);
  const diff = clamp((li-1)/(LEVELS_PER_WONDER-1),0,1)*.6 + w*.02;   // bot testleriyle ayarlandı
  const L = { g, w, li, colors: g <= 8 ? 5 : 6, moves: Math.round(25 - diff*5 + rnd()*4), goals:[],
    blocks: Array.from({length:ROWS},()=>Array(COLS).fill(null)), layers: Array.from({length:ROWS},()=>Array(COLS).fill(0)),
    relics: [], relicTotal:0, seed: g*31 + 7 };
  const mirrorPick = (n, rows, avoid) => { const out = []; let guard = 0;
    while (out.length < n && guard++ < 400){ const r = rows[0] + Math.floor(rnd()*(rows[1]-rows[0]+1)), c = Math.floor(rnd()*(COLS/2));
      const k1 = r*COLS+c, k2 = r*COLS+(COLS-1-c); if (out.includes(k1) || (avoid && (avoid(r,c)))) continue; out.push(k1, k2); }
    return out.slice(0, n + (n%2)); };
  const mechs = ['color','block']; if (W.layer) mechs.push('layer'); if (W.relic) mechs.push('relic');
  // her destinasyonda yeni mekanikler sırayla tanıtılır (ilk dünyada 2 eğitim bölümünden sonra)
  let primary, intro = w === 0 ? li-2 : li-1; L.introduces = null;
  if (g === 1) primary = 'tut1'; else if (g === 2) primary = 'tut2';
  else if (li === 1) primary = 'color';
  else if (intro >= 1 && intro < mechs.length){ primary = mechs[intro]; L.introduces = primary; }
  else primary = mechs[Math.floor(rnd()*mechs.length)];
  const colorGoal = (k, base) => { const cs = shuffleArr([...Array(L.colors).keys()], rnd).slice(0,k); cs.forEach(ci => L.goals.push({ t:'color', c:ci, n: Math.round(base + diff*14 + rnd()*4) })); };
  const placeBlocks = (n) => { const ks = mirrorPick(n, [2,6]); const hard = W.blocks[1];
    ks.forEach(k=>{ const r = Math.floor(k/COLS), c = k%COLS; let kind = W.blocks[0]; if (hard && rnd() < .15 + diff*.45) kind = hard; let hp = BLOCKS[kind].hp; if (hp >= 3 && rnd() > diff*.8) hp = 2; L.blocks[r][c] = { kind, hp, max:hp }; });
    // simetri: ayna hücre aynı tür olsun
    for (let r=0;r<ROWS;r++) for (let c=0;c<COLS/2;c++){ const b = L.blocks[r][c]; if (b) L.blocks[r][COLS-1-c] = { ...b }; else L.blocks[r][COLS-1-c] = null; }
    return L.blocks.flat().filter(Boolean).length; };
  const placeLayers = (n) => { const ks = mirrorPick(n, [1,7], (r,c)=>L.blocks[r][c]); let cnt = 0;
    ks.forEach(k=>{ const r = Math.floor(k/COLS), c = k%COLS; if (L.blocks[r][c]) return; L.layers[r][c] = rnd() < diff*.45 ? 2 : 1; cnt++; }); return cnt; };
  switch (primary){
    case 'tut1': L.moves = 20; L.goals.push({t:'color',c:0,n:12},{t:'color',c:3,n:12}); break;
    case 'tut2': L.moves = 20; L.goals.push({t:'score',n:3000}); break;
    case 'color': colorGoal(rnd()<.5?1:2, 14); if (li > 6 && rnd() < .6) placeBlocks(4 + Math.floor(diff*6)); break;
    case 'block': { const n = placeBlocks(6 + Math.floor(diff*8)); L.goals.push({ t:'block', n }); L.moves += 4; if (rnd()<.35) colorGoal(1, 12); break; }
    case 'layer': { if (rnd() < .3) placeBlocks(4); const n = placeLayers(8 + Math.floor(diff*12)); L.goals.push({ t:'layer', n }); L.moves += 6; break; }
    case 'relic': { if (rnd() < .35) placeBlocks(4 + Math.floor(diff*4)); L.relicTotal = 2 + Math.floor(diff*2); L.goals.push({ t:'relic', n:L.relicTotal }); L.moves += 9;
      const cols = shuffleArr([1,2,3,4,5,6], rnd).slice(0, Math.min(3, L.relicTotal)); cols.forEach(c=>{ if (!L.blocks[0][c]) L.relics.push([0,c]); }); break; }
  }
  L.primary = primary;
  // imza mekaniği (ayrı tohum: temel bölüm düzeni değişmez)
  const r2 = mulberry32(g*131 + 7), SG = SIGS[W.id];
  L.sig = li === SIG_INTRO_LI || (li > SIG_INTRO_LI && r2() < .45);
  L.sigIntro = li === SIG_INTRO_LI; L.locks = []; L.lotus = [];
  const countBlocks = () => L.blocks.flat().filter(Boolean).length, countLayers = () => L.layers.flat().filter(v=>v>0).length;
  const ensureGoal = (t, n) => { const gl = L.goals.find(x=>x.t===t); if (gl) gl.n = n; else L.goals.push({ t, n }); };
  if (L.sig){
    const free = (r,c) => L.blocks[r][c] || L.relics.some(([y,x])=>y===r&&x===c);
    if (SG.id === 'shield'){ mirrorPick(2 + 2*Math.floor(r2()*2), [2,6], free).forEach(k=>{ L.blocks[Math.floor(k/COLS)][k%COLS] = { kind:'shield', hp:1, max:1 }; }); ensureGoal('block', countBlocks()); L.moves += 7; }
    else if (SG.id === 'sandstorm' || SG.id === 'wind'){ if (!countLayers()) placeLayers(7); ensureGoal('layer', countLayers()); L.moves += SG.id === 'sandstorm' ? 8 : 4; }
    else if (SG.id === 'raid'){ if (!countBlocks()) placeBlocks(4); ensureGoal('block', countBlocks()); L.moves += 3; }
    else if (SG.id === 'lock'){ L.locks = mirrorPick(4 + Math.floor(diff*4), [2,6], free).map(k=>[Math.floor(k/COLS), k%COLS]); L.goals.push({ t:'lock', n:L.locks.length }); L.moves += 6; }
    else if (SG.id === 'lotus'){ L.lotus = mirrorPick(6, [1,7], (r,c)=>L.blocks[r][c]).map(k=>[Math.floor(k/COLS), k%COLS]); }
  }
  // testere dişi: 5'li döngünün 1. bölümü "nefes", 5. bölümü parça taşıyan "zor bölüm"
  const pos = (g-1) % LEVELS_PER_PIECE;
  L.hard = g > LEVELS_PER_PIECE && pos === LEVELS_PER_PIECE-1;
  if (g > LEVELS_PER_PIECE && pos === 0) L.moves += 3;
  if (L.hard){ L.moves -= 2; L.goals.forEach(gl=>{ if (gl.t==='color' || gl.t==='score') gl.n = Math.round(gl.n*1.15); }); }
  if (g <= 10) L.moves += 6 - Math.floor(g/3);           // ilk 10 bölüm: öğrenme dönemi, cömert hamle
  else if (L.li <= 3) L.moves += 2;                       // yeni destinasyona yumuşak giriş
  L.moves = Math.max(14, L.moves);
  return L;
}

  if (goal.t === 'layer') return iconURL('l'+W.layer, c=>{ c.scale(.85,.85); drawLayer(c, W.layer, 1); });

const boardCv = $('#board'), bctx = boardCv.getContext('2d');

function tween(o, to, dur, ease=easeOutCubic, delay=0){
  return new Promise(res=>{ tweens.push({ o, to, from:null, dur, t:-delay, ease, res }); });
}
function stepTweens(dt){
  for (let i=tweens.length-1;i>=0;i--){ const tw = tweens[i]; tw.t += dt; if (tw.t < 0) continue;
    if (!tw.from){ tw.from = {}; for (const k in tw.to) tw.from[k] = tw.o[k]; }
    const p = Math.min(1, tw.t/tw.dur), e = tw.ease(p); for (const k in tw.to) tw.o[k] = tw.from[k] + (tw.to[k]-tw.from[k])*e;
    if (p >= 1){ tweens.splice(i,1); tw.res(); } }
}
function newGem(color, r, c, extra={}){ return Object.assign({ id:gid++, kind:'gem', color, sp:null, x:c, y:r, s:1, a:1, rot:0 }, extra); }

function startLevel(g){
  const L = makeLevel(g), W = WONDERS[L.w];
  G = { L, W, g, grid: Array.from({length:ROWS},()=>Array(COLS).fill(null)), blocks: L.blocks.map(r=>r.map(b=>b?{...b}:null)), layers: L.layers.map(r=>r.slice()),
        moves: L.moves, score:0, goals: L.goals.map(x=>({...x, left:x.n})), relicSpawned:0, relicCollected:0, busy:false, over:false,
        rnd: mulberry32(L.seed), sel:null, hint:null, idle:0, combo:0,
        lotus: Array.from({length:ROWS},()=>Array(COLS).fill(false)), turn:0, raids:0, startMs: Date.now() };
  G.layerCap = G.layers.flat().filter(v=>v>0).length;
  L.lotus.forEach(([r,c])=>{ G.lotus[r][c] = true; });
  fillInitial();
  showScreen('gameScreen'); layoutBoard(); renderHUD();
  if (g === 1) setTimeout(()=>toast('Aynı türden 3 objeyi yan yana getir'), 400);
}
function randColor(){ return Math.floor(G.rnd() * G.L.colors); }
function fillInitial(){
  let tries = 0;
  do {
    for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++){
      G.grid[r][c] = null; if (G.blocks[r][c]) continue;
      let col, guard = 0;
      do { col = randColor(); guard++; } while (guard < 20 && ((c>=2 && sameCol(r,c-1,col) && sameCol(r,c-2,col)) || (r>=2 && sameCol(r-1,c,col) && sameCol(r-2,c,col))));
      G.grid[r][c] = newGem(col, r, c);
    }
    G.relicSpawned = 0;
    G.L.relics.forEach(([r,c])=>{ G.grid[r][c] = newGem(-1, r, c, { kind:'relic', shape:G.W.relic.shape }); G.relicSpawned++; });
    G.L.locks.forEach(([r,c])=>{ const gm = G.grid[r][c]; if (gm && gm.kind==='gem') gm.lock = true; });
  } while ((findGroups().length || !findMove()) && ++tries < 50);
  const me = G; me.busy = true; setTimeout(()=>{ if (G === me) me.busy = false; }, 900);
  for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++){ const gm = G.grid[r][c]; if (gm){ gm.y = r - ROWS - 1 - (COLS-c)*.15; tween(gm, { y:r }, 520 + r*30, easeOutBack, c*25); } }
}
function sameCol(r,c,col){ const g = G.grid[r] && G.grid[r][c]; return g && g.kind === 'gem' && g.color === col; }
const inB = (r,c) => r>=0 && r<ROWS && c>=0 && c<COLS;
const isSpecial = g => g && (g.kind === 'disk' || (g.kind === 'gem' && g.sp));

function findGroups(){
  const runs = [];
  const m = (r,c) => { const g = G.grid[r][c]; return g && g.kind === 'gem' ? g.color : -1; };
  for (let r=0;r<ROWS;r++){ let c=0; while (c<COLS){ const col = m(r,c); if (col<0){ c++; continue; } let n=1; while (c+n<COLS && m(r,c+n)===col) n++; if (n>=3) runs.push({ dir:'h', color:col, cells:[...Array(n)].map((_,i)=>[r,c+i]) }); c+=n; } }
  for (let c=0;c<COLS;c++){ let r=0; while (r<ROWS){ const col = m(r,c); if (col<0){ r++; continue; } let n=1; while (r+n<ROWS && m(r+n,c)===col) n++; if (n>=3) runs.push({ dir:'v', color:col, cells:[...Array(n)].map((_,i)=>[r+i,c]) }); r+=n; } }
  // kesişen serileri grupla (T / L)
  const parent = runs.map((_,i)=>i); const find = i => parent[i]===i?i:(parent[i]=find(parent[i]));
  const owner = new Map();
  runs.forEach((run,i)=>run.cells.forEach(([r,c])=>{ const k = r*COLS+c; if (owner.has(k)) parent[find(i)] = find(owner.get(k)); else owner.set(k,i); }));
  const groups = new Map();
  runs.forEach((run,i)=>{ const root = find(i); if (!groups.has(root)) groups.set(root, { runs:[], cells:new Map(), color:run.color }); const gp = groups.get(root); gp.runs.push(run); run.cells.forEach(([r,c])=>gp.cells.set(r*COLS+c,[r,c])); });
  return [...groups.values()];
}
function matchAt(r,c){
  const g = G.grid[r][c]; if (!g || g.kind !== 'gem') return false; const col = g.color;
  let h = 1, x = c-1; while (x>=0 && sameCol(r,x,col)){ h++; x--; } x = c+1; while (x<COLS && sameCol(r,x,col)){ h++; x++; }
  if (h>=3) return true;
  let v = 1, y = r-1; while (y>=0 && sameCol(y,c,col)){ v++; y--; } y = r+1; while (y<ROWS && sameCol(y,c,col)){ v++; y++; }
  return v>=3;
}
function findMove(){
  for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++){
    for (const [dr,dc] of [[0,1],[1,0]]){ const r2 = r+dr, c2 = c+dc; if (!inB(r2,c2)) continue;
      const a = G.grid[r][c], b = G.grid[r2][c2]; if (!a || !b || a.lock || b.lock) continue;
      if ((a.kind==='disk' && b.kind!=='relic') || (b.kind==='disk' && a.kind!=='relic')) return [[r,c],[r2,c2]];
      if (isSpecial(a) && isSpecial(b)) return [[r,c],[r2,c2]];
      G.grid[r][c] = b; G.grid[r2][c2] = a; const ok = matchAt(r,c) || matchAt(r2,c2); G.grid[r][c] = a; G.grid[r2][c2] = b;
      if (ok) return [[r,c],[r2,c2]]; } }
  return null;
}

let drag = null;
function cellFromEvent(e){ const rect = boardCv.getBoundingClientRect(); const x = (e.clientX - rect.left - pad)/cell, y = (e.clientY - rect.top - pad)/cell; return { c: Math.floor(x), r: Math.floor(y), x, y }; }

  Sound.ensure(); if (!G || G.busy || G.over) return; const p = cellFromEvent(e); if (!inB(p.r,p.c)) return;

  if (Math.hypot(dx,dy) > .4 && !drag.moved){ drag.moved = true; let dr=0, dc=0; if (Math.abs(dx) > Math.abs(dy)) dc = Math.sign(dx); else dr = Math.sign(dy);

boardCv.addEventListener('pointerup', ()=>{
  if (!drag || !G) { drag = null; return; } const d = drag; drag = null; if (d.moved || G.busy) return;
  if (G.sel && Math.abs(G.sel[0]-d.r) + Math.abs(G.sel[1]-d.c) === 1){ const a = G.sel; G.sel = null; trySwap(a,[d.r,d.c]); }
  else if (G.sel && G.sel[0]===d.r && G.sel[1]===d.c) G.sel = null;
  else if (G.grid[d.r][d.c]) G.sel = [d.r,d.c];
});

async function trySwap(a, b){
  const A = G.grid[a[0]][a[1]], B = G.grid[b[0]][b[1]];
  if (!A || !B || G.busy || G.over) return;
  if (A.lock || B.lock){ Sound.bad(); [A,B].forEach(g=>{ if (g.lock){ const x = g.x; tween(g,{ x:x+.12 },60).then(()=>tween(g,{ x:x-.12 },80)).then(()=>tween(g,{ x },60)); } }); toast('Sarmaşık kilidi! Eşleştirerek kurtar'); return; }
  G.busy = true; G.combo = 0; Sound.swap();
  G.grid[a[0]][a[1]] = B; G.grid[b[0]][b[1]] = A;
  await Promise.all([tween(A,{x:b[1],y:b[0]},150,easeInOut), tween(B,{x:a[1],y:a[0]},150,easeInOut)]);
  const comboable = (A.kind==='disk' && B.kind!=='relic') || (B.kind==='disk' && A.kind!=='relic') || (isSpecial(A) && isSpecial(B));
  if (comboable){ G.moves--; renderHUD(); await doCombo(A, B, b); await settle(); await resolve(null); return endTurn(); }
  const groups = findGroups();
  if (!groups.length){
    Sound.bad(); G.grid[a[0]][a[1]] = A; G.grid[b[0]][b[1]] = B;
    await Promise.all([tween(A,{x:a[1],y:a[0]},150,easeInOut), tween(B,{x:b[1],y:b[0]},150,easeInOut)]);
    G.busy = false; return;
  }
  G.moves--; renderHUD();
  await resolve([a,b]);
  endTurn();
}

async function resolve(swapCells){
  let first = true;
  for (let guard=0; guard<60; guard++){
    const groups = findGroups(); if (!groups.length) break;
    await processGroups(groups, first ? swapCells : null);
    first = false; await settle(); G.combo++;
  }
}

function specialFor(gp){
  const maxRun = Math.max(...gp.runs.map(r=>r.cells.length));
  const hasH = gp.runs.some(r=>r.dir==='h'), hasV = gp.runs.some(r=>r.dir==='v');
  if (maxRun >= 5) return { kind:'disk' };
  if (hasH && hasV) return { sp:'b' };
  if (maxRun === 4) return { sp: gp.runs.find(r=>r.cells.length===4).dir };
  return null;
}
async function processGroups(groups, swapCells){
  const create = []; const matchCells = [];
  groups.forEach(gp=>{
    const cells = [...gp.cells.values()]; matchCells.push(...cells);
    const sp = specialFor(gp); if (!sp) return;
    let pos = null;
    if (swapCells) pos = swapCells.find(([r,c])=>gp.cells.has(r*COLS+c));
    if (!pos && sp.sp === 'b'){ const cnt = new Map(); gp.runs.forEach(run=>run.cells.forEach(([r,c])=>{ const k=r*COLS+c; cnt.set(k,(cnt.get(k)||0)+1); })); for (const [k,n] of cnt) if (n>1){ pos = [Math.floor(k/COLS), k%COLS]; break; } }
    if (!pos){ const longest = gp.runs.reduce((a,b)=>b.cells.length>a.cells.length?b:a); pos = longest.cells[Math.floor(longest.cells.length/2)]; }
    create.push({ pos, color: gp.color, ...sp });
  });
  const pts = matchCells.length * 60 * (1 + G.combo*.5);
  const ctr = matchCells.reduce((a,[r,c])=>[a[0]+r/matchCells.length, a[1]+c/matchCells.length],[0,0]);
  addScore(Math.round(pts), ctr[0], ctr[1]);
  Sound.match(G.combo);
  await clearCells(matchCells, { adjacent:true, create });
}

function addScore(n, r, c){ G.score += n; popups.push({ text:'+'+n, x:c, y:r, life:0, max:900 }); renderHUD(); }

async function clearCells(cells, { adjacent=false, create=[], pre=new Set(), extraSource=null } = {}){
  const depth = new Map();    // key -> gecikme derinliği
  const blockHits = new Map();
  const queue = [];
  const add = (r,c,d,fromEffect) => {
    if (!inB(r,c)) return; const k = r*COLS+c;
    if (G.blocks[r][c]){ if (fromEffect) blockHits.set(k, Math.min(blockHits.get(k) ?? 99, d)); return; }
    const g = G.grid[r][c]; if (!g || g.kind === 'relic') return;
    if (depth.has(k)) return; depth.set(k, d);
    if (isSpecial(g) && !pre.has(g.id)) queue.push({ g, r, c, d });
  };
  cells.forEach(([r,c])=>add(r,c,0,false));
  const createKeys = new Set(create.map(cr=>cr.pos[0]*COLS+cr.pos[1]));
  // oluşturulacak özel taşın yerindeki sıradan taş tetiklenmez
  while (queue.length){
    const { g, r, c, d } = queue.shift(); if (g._fired) continue; g._fired = true;
    if (createKeys.has(r*COLS+c) && d === 0 && !g.sp && g.kind!=='disk') continue;
    const nd = d + 1;
    if (g.kind === 'disk'){ const col = mostCommonColor(); effects.push({ t:'rays', r, c, color: STONES[col]?.color || '#fff', life:0, max:600 }); Sound.special();
      for (let y=0;y<ROWS;y++) for (let x=0;x<COLS;x++){ const o = G.grid[y][x]; if (o && o.kind==='gem' && o.color===col) add(y,x,nd,true); } }
    else if (g.sp === 'h'){ effects.push({ t:'beam', dir:'h', r, c, life:0, max:420 }); Sound.special(); for (let x=0;x<COLS;x++) add(r,x,nd,true); }
    else if (g.sp === 'v'){ effects.push({ t:'beam', dir:'v', r, c, life:0, max:420 }); Sound.special(); for (let y=0;y<ROWS;y++) add(y,c,nd,true); }
    else if (g.sp === 'b'){ effects.push({ t:'wave', r, c, rad:1.6, life:0, max:500 }); Sound.boom(); for (let y=r-1;y<=r+1;y++) for (let x=c-1;x<=c+1;x++) add(y,x,nd,true); }
    addScore(200, r, c);
  }
  // normal eşleşmelerin komşusundaki engeller hasar alır
  if (adjacent){ cells.forEach(([r,c])=>[[1,0],[-1,0],[0,1],[0,-1]].forEach(([dr,dc])=>{ const y=r+dr, x=c+dc; if (inB(y,x) && G.blocks[y][x] && (G.blocks[y][x].kind !== 'shield' || create.length)){ const k=y*COLS+x; if (!blockHits.has(k)) blockHits.set(k, 0); } })); }

  // animasyon
  let maxD = 0; const anims = [];
  for (const [k,d] of depth){ const r = Math.floor(k/COLS), c = k%COLS, g = G.grid[r][c]; if (!g) continue; maxD = Math.max(maxD,d);
    const delay = d*70;
    anims.push(tween(g,{ s:1.18 },70,easeOutCubic,delay).then(()=>tween(g,{ s:0, a:0 },150,easeInOut)).then(()=>burst(c+.5, r+.5, g.kind==='gem'?STONES[g.color].color:'#ffd45a', 9)));
  }
  for (const [k,d] of blockHits){ maxD = Math.max(maxD,d); }
  await Promise.all(anims);

  // mantıksal temizlik
  for (const [k] of depth){ const r = Math.floor(k/COLS), c = k%COLS, g = G.grid[r][c]; if (!g) continue;
    if (g.kind === 'gem') goalTick('color', 1, g.color);
    if (g.lock){ goalTick('lock', 1); burst(c+.5,r+.5,'#5aa83c',10); }
    G.grid[r][c] = null;
    if (G.lotus[r][c]){ G.lotus[r][c] = false; G.moves++; popups.push({ text:'+1 Hamle', x:c, y:r-.4, life:0, max:1100 }); burst(c+.5,r+.5,'#f6a6c1',14); }
    if (G.layers[r][c] > 0){ G.layers[r][c]--; if (G.layers[r][c] === 0) burst(c+.5,r+.5,'#e7cf9a',6); } }
  syncLayerGoal();
  for (const [k] of blockHits){ const r = Math.floor(k/COLS), c = k%COLS, b = G.blocks[r][c]; if (!b) continue; b.hp--; b.shake = 1; burst(c+.5,r+.5,'#b8b0a0',8,true);
    if (b.hp <= 0){ G.blocks[r][c] = null; goalTick('block',1); addScore(150,r,c); } }
  create.forEach(cr=>{ const [r,c] = cr.pos; if (G.blocks[r][c]) return; const g = newGem(cr.kind==='disk'?-1:cr.color, r, c, cr.kind==='disk'?{kind:'disk'}:{ sp:cr.sp }); g.s = 0; G.grid[r][c] = g; tween(g,{ s:1 },260,easeOutBack); burst(c+.5,r+.5,'#fff3b0',14); });
  renderHUD();
  await wait(60);
}
function mostCommonColor(){ const cnt = Array(6).fill(0); G.grid.flat().forEach(g=>{ if (g && g.kind==='gem') cnt[g.color]++; }); return cnt.indexOf(Math.max(...cnt)); }

async function doCombo(A, B, at){
  const [r,c] = at; const cells = []; const pre = new Set([A.id, B.id]);
  const all = (fn) => { for (let y=0;y<ROWS;y++) for (let x=0;x<COLS;x++) if (fn(y,x)) cells.push([y,x]); };
  const disk = A.kind==='disk' ? A : (B.kind==='disk' ? B : null), other = disk === A ? B : A;
  const posOf = g => { for (let y=0;y<ROWS;y++) for (let x=0;x<COLS;x++) if (G.grid[y][x]===g) return [y,x]; };
  cells.push(posOf(A), posOf(B));
  Sound.special();
  if (disk && other.kind==='disk'){ effects.push({ t:'rays', r, c, color:'#ffffff', life:0, max:900 }); all((y,x)=>G.grid[y][x] && G.grid[y][x].kind!=='relic'); addScore(5000,r,c); toast('Güneş Tutulması!'); }
  else if (disk && !other.sp){ effects.push({ t:'rays', r, c, color: STONES[other.color].color, life:0, max:700 }); all((y,x)=>{ const g = G.grid[y][x]; return g && g.kind==='gem' && g.color===other.color; }); addScore(1500,r,c); }
  else if (disk && other.sp){ // tüm aynı renkleri özel taşa dönüştür
    effects.push({ t:'rays', r, c, color: STONES[other.color].color, life:0, max:900 });
    const targets = []; all((y,x)=>{ const g = G.grid[y][x]; if (g && g.kind==='gem' && g.color===other.color && g!==other){ g.sp = other.sp==='b' ? 'b' : (G.rnd()<.5?'h':'v'); targets.push(g); tween(g,{ s:1.25 },200,easeOutBack).then(()=>tween(g,{ s:1 },150)); return true; } return false; });
    await wait(450); toast('Kadim Güç!');
  } else {
    const t = [A.sp, B.sp].sort().join('');
    if (t === 'bb'){ effects.push({ t:'wave', r, c, rad:3, life:0, max:700 }); Sound.boom(); for (let y=r-2;y<=r+2;y++) for (let x=c-2;x<=c+2;x++) if (inB(y,x)) cells.push([y,x]); toast('Büyük Patlama!'); }
    else if (t.includes('b')){ effects.push({ t:'beam', dir:'h3', r, c, life:0, max:600 }); for (let d=-1; d<=1; d++){ for (let x=0;x<COLS;x++) if (inB(r+d,x)) cells.push([r+d,x]); for (let y=0;y<ROWS;y++) if (inB(y,c+d)) cells.push([y,c+d]); } toast('Kazı Haçı!'); }
    else { effects.push({ t:'beam', dir:'h', r, c, life:0, max:450 }, { t:'beam', dir:'v', r, c, life:0, max:450 }); for (let x=0;x<COLS;x++) cells.push([r,x]); for (let y=0;y<ROWS;y++) cells.push([y,c]); }
    addScore(1200,r,c);
  }
  // kombinasyon hücreleri efektten gelir → engellere de vurur
  await clearCellsEffect(cells, pre);
}
async function clearCellsEffect(cells, pre){
  // efekt temizliği: hücreleri doğrudan "efekt" olarak işaretle
  const uniq = new Map(); cells.forEach(p=>{ if (p) uniq.set(p[0]*COLS+p[1], p); });
  const list = [...uniq.values()];
  const blockCells = list.filter(([r,c])=>G.blocks[r][c]);
  for (const [r,c] of blockCells){ const b = G.blocks[r][c]; b.hp--; b.shake = 1; burst(c+.5,r+.5,'#b8b0a0',8,true); if (b.hp<=0){ G.blocks[r][c] = null; goalTick('block',1); addScore(150,r,c); } }
  // önceden tetiklenmiş ikili hariç, alandaki özel taşlar zincirleme patlar
  await clearCells(list.filter(([r,c])=>!G.blocks[r][c]), { adjacent:false, pre });
}

async function settle(){
  for (let guard=0; guard<30; guard++){
    await gravity();
    // en alt sıraya ulaşan eserler toplanır
    const got = [];
    for (let c=0;c<COLS;c++){ for (let r=ROWS-1;r>=0;r--){ if (G.blocks[r][c]) continue; const g = G.grid[r][c]; if (g && g.kind==='relic' && bottomOf(r,c)) got.push([r,c,g]); break; } }
    if (!got.length) break;
    await Promise.all(got.map(([r,c,g])=>tween(g,{ y:r-1.2, s:1.5, a:0 },450,easeOutCubic).then(()=>{ G.grid[r][c]=null; G.relicCollected++; goalTick('relic',1); burst(c+.5,r+.5,'#ffd45a',20); addScore(1000,r,c); })));
    Sound.piece(); renderHUD();
  }
  if (!findMove() && !goalsDone()) await reshuffle();
}
function bottomOf(r,c){ for (let y=r+1;y<ROWS;y++) if (!G.blocks[y][c]) return false; return true; }
const isFixed = (r,c) => G.blocks[r][c] || (G.grid[r][c] && G.grid[r][c].lock);
function fillableFromAbove(r,c){ for (let y=r; y>=0; y--) if (isFixed(y,c)) return false; return true; }
function spawnGem(c){
  const rel = G.W.relic && G.relicSpawned < G.L.relicTotal && relicsOnBoard() < 3 && G.rnd() < .25;
  if (rel){ G.relicSpawned++; return newGem(-1,-1,c,{ kind:'relic', shape:G.W.relic.shape }); }
  return newGem(randColor(), -1, c);
}
const relicsOnBoard = () => G.grid.flat().filter(g=>g && g.kind==='relic').length;
async function gravity(){
  for (let pass=0; pass<200; pass++){
    const moves = []; const moved = new Set();
    for (let r=ROWS-1;r>=0;r--) for (let c=0;c<COLS;c++){
      if (G.blocks[r][c] || G.grid[r][c]) continue;
      if (r === 0){ const g = spawnGem(c); G.grid[0][c] = g; g.y = -1; moved.add(g.id); moves.push(tween(g,{ y:0 },85,linear)); continue; }
      const above = G.grid[r-1][c];
      if (above && !above.lock && !moved.has(above.id) && !G.blocks[r-1][c]){ G.grid[r][c] = above; G.grid[r-1][c] = null; moved.add(above.id); moves.push(tween(above,{ y:r },85,linear)); }
    }
    if (!moves.length){
      for (let r=ROWS-1;r>0;r--) for (let c=0;c<COLS;c++){
        if (G.blocks[r][c] || G.grid[r][c] || fillableFromAbove(r-1,c)) continue;
        for (const dc of [-1,1]){ const x = c+dc; if (!inB(r-1,x)) continue; const g = G.grid[r-1][x];
          if (g && !g.lock && !moved.has(g.id) && !G.blocks[r-1][x]){ G.grid[r][c] = g; G.grid[r-1][x] = null; moved.add(g.id); moves.push(tween(g,{ x:c, y:r },95,linear)); break; } }
      }
    }
    if (!moves.length) break;
    await Promise.all(moves);
  }
}
async function reshuffle(){
  toast('Taşlar karıştırılıyor…');
  const spots = [], gems = [];
  for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++){ const g = G.grid[r][c]; if (g && g.kind==='gem' && !g.sp && !g.lock){ spots.push([r,c]); gems.push(g); } }
  for (let t=0;t<80;t++){ shuffleArr(gems, G.rnd); spots.forEach(([r,c],i)=>G.grid[r][c]=gems[i]); if (!findGroups().length && findMove()) break; if (t>40) gems.forEach(g=>g.color = randColor()); }
  await Promise.all(spots.map(([r,c])=>tween(G.grid[r][c],{ x:c, y:r },420,easeInOut)));
}

function syncLayerGoal(){ const n = G.layers.flat().filter(v=>v>0).length; G.goals.forEach(gl=>{ if (gl.t==='layer') gl.left = n; }); }
function goalTick(t, n, color){ G.goals.forEach(gl=>{ if (gl.t===t && (t!=='color' || gl.c===color) && gl.left>0) gl.left = Math.max(0, gl.left-n); }); }
function goalsDone(){ return G.goals.every(gl => gl.t==='score' ? G.score >= gl.n : gl.left <= 0); }

async function sigTick(){
  const SG = SIGS[G.W.id]; G.turn++;
  if (!SG.every || G.turn % SG.every !== 0) return;
  const R = G.rnd;
  if (SG.id === 'sandstorm'){
    const cand = []; for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++) if (G.layers[r][c] > 0) [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dr,dc])=>{ const y=r+dr, x=c+dc; if (inB(y,x) && !G.blocks[y][x] && G.layers[y][x] === 0) cand.push([y,x]); });
    if (!cand.length || G.layers.flat().filter(v=>v>0).length >= G.layerCap) return; const [y,x] = cand[Math.floor(R()*cand.length)]; G.layers[y][x] = 1; burst(x+.5,y+.5,'#e9c98e',16); toast('Kum fırtınası!');
  } else if (SG.id === 'wind'){
    if (!G.layers.flat().some(v=>v>0)) return;
    for (let r=0;r<ROWS;r++){ const cols = [...Array(COLS).keys()].filter(c=>!G.blocks[r][c]); const vals = cols.map(c=>G.layers[r][c]); cols.forEach((c,i)=>{ G.layers[r][c] = vals[(i-1+vals.length)%vals.length]; }); }
    toast('Rüzgâr bulutları sürükledi');
  } else if (SG.id === 'raid'){
    if (G.raids >= 4) return;
    const cand = []; for (let r=1;r<=3;r++) for (let c=0;c<COLS;c++){ const g = G.grid[r][c]; if (g && g.kind==='gem' && !g.sp && !g.lock) cand.push([r,c]); }
    if (!cand.length) return; const [y,x] = cand[Math.floor(R()*cand.length)]; G.grid[y][x] = null; G.blocks[y][x] = { kind:'wood', hp:1, max:1, shake:1 }; G.raids++;
    G.goals.forEach(gl=>{ if (gl.t==='block') gl.left++; }); burst(x+.5,y+.5,'#b07a42',16,true); Sound.boom(); toast('Akıncılar barikat kurdu!');
  } else if (SG.id === 'sunlight'){
    const cand = []; for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++){ const g = G.grid[r][c]; if (g && g.kind==='gem' && !g.sp && !g.lock) cand.push(g); }
    if (!cand.length) return; const g = cand[Math.floor(R()*cand.length)]; g.sp = R() < .5 ? 'h' : 'v';
    effects.push({ t:'rays', r:g.y, c:g.x, color:'#ffd45a', life:0, max:800 }); tween(g,{ s:1.3 },220,easeOutBack).then(()=>tween(g,{ s:1 },180)); Sound.special(); toast('Kukulkan’ın ışığı!');
  }
  syncLayerGoal(); renderHUD(); await wait(450);
}
async function endTurn(){
  renderHUD();
  if (goalsDone()) return winLevel();
  if (G.L.sig && G.moves > 0 && !G.over){ await sigTick(); if (goalsDone()) return winLevel(); }
  if (G.moves <= 0){ G.over = true; await wait(300); return loseLevel(); }
  G.busy = false; G.idle = 0;
}

/* ---- çizim ---- */
function layoutBoard(){
  const wrap = $('#boardWrap'); const W = wrap.clientWidth - 16, H = wrap.clientHeight - 8;
  const size = Math.max(240, Math.min(W, H, 560));
  cell = Math.floor((size - 12) / COLS); pad = Math.floor((size - cell*COLS)/2);
  const px = cell*COLS + pad*2; DPR = Math.min(2, window.devicePixelRatio || 1);
  boardCv.style.width = boardCv.style.height = px + 'px'; boardCv.width = boardCv.height = Math.round(px*DPR);
  spriteCache.clear();
}
let boardTex = null;
function boardTexture(){
  if (boardTex && boardTex.w === boardCv.width) return boardTex.cv;
  const cv = document.createElement('canvas'); cv.width = cv.height = boardCv.width; const c = cv.getContext('2d'); c.scale(DPR,DPR);
  const S = cell*COLS + pad*2;
  rrect(c,0,0,S,S,pad*2); c.fillStyle = grad(c,0,0,0,S,[[0,'#d8d0c0'],[1,'#c9c0ae']]); c.fill();
  rrect(c,pad*.5,pad*.5,S-pad,S-pad,pad*1.6); c.fillStyle='rgba(255,255,255,.35)'; c.fill();
  const r = mulberry32(99);
  for (let y=0;y<ROWS;y++) for (let x=0;x<COLS;x++){ c.fillStyle = (x+y)%2 ? '#f2ede3' : '#e9e2d4'; rrect(c,pad+x*cell+1,pad+y*cell+1,cell-2,cell-2,cell*.16); c.fill();
    for (let i=0;i<6;i++){ c.fillStyle = 'rgba(140,120,90,.06)'; c.fillRect(pad+x*cell+r()*cell, pad+y*cell+r()*cell, 2, 2); } }
  boardTex = { w: boardCv.width, cv }; return cv;
}
function renderBoard(t){
  if (!G) return; const c = bctx; c.setTransform(1,0,0,1,0,0); c.clearRect(0,0,boardCv.width,boardCv.height);
  c.drawImage(boardTexture(),0,0); c.setTransform(DPR,0,0,DPR,0,0);
  const S = Math.round(cell*DPR);
  // katmanlar
  for (let r=0;r<ROWS;r++) for (let x=0;x<COLS;x++){ const L = G.layers[r][x]; if (L>0 && !G.blocks[r][x]){ c.drawImage(sprite('L'+G.W.layer+L, S, cc=>drawLayer(cc,G.W.layer,L)), pad+x*cell, pad+r*cell, cell, cell); } }
  for (let r=0;r<ROWS;r++) for (let x=0;x<COLS;x++) if (G.lotus[r][x] && !G.blocks[r][x]) c.drawImage(sprite('lotus', S, drawLotus), pad+x*cell, pad+r*cell, cell, cell);
  // seçim
  if (G.sel){ const [r,x] = G.sel; c.save(); c.strokeStyle='#e8b23a'; c.lineWidth=3; c.shadowColor='#e8b23a'; c.shadowBlur=10; rrect(c,pad+x*cell+2,pad+r*cell+2,cell-4,cell-4,cell*.18); c.stroke(); c.restore(); }
  // engeller

/* ---- kazan / kaybet ---- */
function starsFor(){ const ratio = G.moves / G.L.moves; return ratio >= .3 ? 3 : ratio >= .12 ? 2 : 1; }
async function winLevel(){
  G.over = true; G.busy = true; G.endMoves = G.moves; const me = G; await wait(250); if (G !== me) return;
  toast('Bölüm Tamamlandı!'); Sound.win();
  const stars = starsFor();
  // kalan hamle bonusu: her hamle rastgele bir taşı parlatır
  const bonusMoves = G.moves;
  for (let i=0; i<Math.min(bonusMoves, 12); i++){ const cand = G.grid.flat().filter(g=>g && g.kind==='gem'); const g = cand[Math.floor(Math.random()*cand.length)]; if (g){ burst(g.x+.5,g.y+.5,'#fff1b0',10); addScore(250, g.y, g.x); } G.moves--; renderHUD(); await wait(90); if (G !== me) return; }
  if (bonusMoves > 12){ addScore((bonusMoves-12)*250, 3.5, 3.5); G.moves = 0; }
  await wait(600); if (G !== me) return;
  logAttempt('win', stars);
  const g = G.g; save.stars[g] = Math.max(save.stars[g] || 0, stars);
  const prevPieces = piecesOf(G.L.w);
  if (save.lvl === g) save.lvl = g + 1;
  persist();
  const earnedPiece = piecesOf(G.L.w) > prevPieces;
  const refilled = earnedPiece && syncLives() < MAX_LIVES;
  if (earnedPiece){ save.lives = MAX_LIVES; save.lifeTs = null; persist(); }
  const W = G.W;
  const finished = save.lvl > TOTAL_LEVELS;
  openModal(`
    <div class="kicker">${W.name} · Bölüm ${G.L.li}</div>
    <h2>Harika iş!</h2>
    <div class="stars">${[1,2,3].map(i=>`<span class="${i<=stars?'on':''}" style="animation-delay:${i*.18}s">★</span>`).join('')}</div>
    <p style="text-align:center;font-weight:900;font-size:20px;margin:4px 0">${G.score.toLocaleString('tr-TR')} puan</p>
    ${earnedPiece ? `<p style="text-align:center"><b>Yeni bir ${W.name} puzzle parçası kazandın!</b><br><span style="color:var(--muted);font-weight:700;font-size:14px">Haritada ${W.name} çevresinde yeni bir süs açıldı.</span>${refilled ? `<br><span style="color:#c23b3b;font-weight:800">♥ Canların doldu!</span>` : ''}</p>` : `<p style="text-align:center;color:var(--muted);font-weight:700">Sonraki puzzle parçasına ${LEVELS_PER_PIECE - ((save.lvl-1)%LEVELS_PER_PIECE)} bölüm kaldı.</p>`}
    <div class="row">${earnedPiece ? `<button class="btn wide" id="mPiece">Parçayı Al</button>` : `<button class="btn ghost" id="mMap">Harita</button>${finished?'':'<button class="btn" id="mNext">Sonraki Bölüm</button>'}`}</div>`);
  if (earnedPiece) $('#mPiece').onclick = () => { closeModal(); openPuzzle(G.L.w, { reward:true }); };
  else { $('#mMap').onclick = () => { closeModal(); openMap(); }; const n = $('#mNext'); if (n) n.onclick = () => { closeModal(); openLevelIntro(save.lvl); }; }
}
function loseLevel(){
  Sound.lose(); logAttempt('lose'); loseLife();
  const lives = save.lives;
  const remaining = G.goals.map(gl=>`<div class="goal"><img alt="" src="${goalIcon(gl,G.W)}">${gl.t==='score'?Math.max(0,gl.n-G.score).toLocaleString('tr-TR'):gl.left}</div>`).join('');

/* =====================================================================
   JIGSAW PUZZLE
   ===================================================================== */
const PZ = (() => { const n = PIECES_PER_WONDER; const opts = [[4,3],[3,3],[4,4],[5,4],[3,2],[6,4]]; return opts.find(([c,r])=>c*r===n) || [Math.ceil(Math.sqrt(n*4/3)), Math.ceil(n/Math.ceil(Math.sqrt(n*4/3)))]; })();
const PZC = PZ[0], PZR = PZ[1];
function pzEdges(w){ const r = mulberry32(500+w); const v = [], h = [];
  for (let i=0;i<PZR;i++){ v.push([]); for (let j=0;j<PZC-1;j++) v[i].push(r()<.5?1:-1); }
  for (let i=0;i<PZR-1;i++){ h.push([]); for (let j=0;j<PZC;j++) h[i].push(r()<.5?1:-1); }
  return { v, h }; }
function pzOrder(w){ return shuffleArr([...Array(PZC*PZR).keys()], mulberry32(900+w)); }
function edgeTo(c, x0,y0,x1,y1, sign){
  if (!sign){ c.lineTo(x1,y1); return; }
  const dx = x1-x0, dy = y1-y0, L = Math.hypot(dx,dy), ux = dx/L, uy = dy/L, nx = uy*sign, ny = -ux*sign;
  const P = (t,h) => [x0+dx*t+nx*h*L, y0+dy*t+ny*h*L];
  c.lineTo(...P(.36,0)); c.bezierCurveTo(...P(.46,0), ...P(.36,.24), ...P(.5,.24)); c.bezierCurveTo(...P(.64,.24), ...P(.54,0), ...P(.64,0)); c.lineTo(x1,y1);
}
function piecePath(c, idx, E, pw, ph, ox=0, oy=0){
  const i = Math.floor(idx/PZC), j = idx%PZC, x = ox + j*pw, y = oy + i*ph;
  const top = i>0 ? -E.h[i-1][j] : 0, bottom = i<PZR-1 ? E.h[i][j] : 0, left = j>0 ? -E.v[i][j-1] : 0, right = j<PZC-1 ? E.v[i][j] : 0;
  c.beginPath(); c.moveTo(x,y); edgeTo(c,x,y,x+pw,y,top); edgeTo(c,x+pw,y,x+pw,y+ph,right); edgeTo(c,x+pw,y+ph,x,y+ph,bottom); edgeTo(c,x,y+ph,x,y,left); c.closePath();
}
function drawPuzzle(cv, w, owned, opts={}){
  const c = cv.getContext('2d'); const W = cv.width, H = cv.height; const pw = W/PZC, ph = H/PZR; const E = pzEdges(w); const img = sceneCanvas(WONDERS[w].id);
  c.clearRect(0,0,W,H);
  // boş alan: soluk görsel ipucu
  c.save(); c.globalAlpha = .16; c.filter = 'grayscale(1)'; c.drawImage(img,0,0,W,H); c.restore(); c.filter = 'none';
  c.fillStyle='rgba(20,10,4,.35)'; c.fillRect(0,0,W,H);
  const lw = Math.max(1, W/400);
  for (let k=0;k<PZC*PZR;k++){ if (owned.has(k) || k===opts.hide) continue; piecePath(c,k,E,pw,ph); c.setLineDash([6*lw,5*lw]); c.lineWidth = lw*1.2; c.strokeStyle='rgba(255,230,190,.35)'; c.stroke(); c.setLineDash([]); }
  if (opts.complete){ c.drawImage(img,0,0,W,H); return; }
  for (const k of owned){ if (k===opts.hide) continue; c.save(); piecePath(c,k,E,pw,ph); c.clip(); c.drawImage(img,0,0,W,H); c.restore();
    piecePath(c,k,E,pw,ph); c.lineWidth = lw*1.6; c.strokeStyle='rgba(60,30,10,.55)'; c.stroke(); c.save(); c.translate(-lw*.6,-lw*.6); piecePath(c,k,E,pw,ph); c.lineWidth=lw; c.strokeStyle='rgba(255,255,255,.35)'; c.stroke(); c.restore(); }
}
function pieceCanvas(w, k, W, H){
  const pw = W/PZC, ph = H/PZR, m = Math.max(pw,ph)*.3; const cv = document.createElement('canvas'); cv.width = Math.ceil(pw+m*2); cv.height = Math.ceil(ph+m*2);
  const c = cv.getContext('2d'); const E = pzEdges(w); const i = Math.floor(k/PZC), j = k%PZC;

  c.save(); piecePath(c,k,E,pw,ph); c.clip(); c.drawImage(sceneCanvas(WONDERS[w].id),0,0,W,H); c.restore();
  piecePath(c,k,E,pw,ph); c.lineWidth=2; c.strokeStyle='rgba(255,240,200,.9)'; c.stroke();

}
const ownedSet = (w, n) => new Set(pzOrder(w).slice(0, n));

let pzView = { w:0 };
function sizePuzzleCanvas(){ const cv = $('#puzzle'); const maxW = Math.min(window.innerWidth - 60, 580), maxH = window.innerHeight*.48; let w = maxW, h = w*.75; if (h > maxH){ h = maxH; w = h/.75; } cv.style.width = w+'px'; cv.style.height = h+'px'; const d = Math.min(2, window.devicePixelRatio||1); cv.width = Math.round(w*d); cv.height = Math.round(h*d); }

    const p = $('#pzPlay'); if (p) p.onclick = () => openLevelIntro(save.lvl); const m = $('#pzMap'); if (m) m.onclick = () => openMap(); };
  if (!reward){ drawPuzzle(cv, w, ownedSet(w,n), { complete: n>=PIECES_PER_WONDER }); info(); return; }
  // ödül animasyonu: yeni parça ekranın ortasından uçup yerine oturur

  const k = pzOrder(w)[n-1]; const owned = ownedSet(w, n);
  drawPuzzle(cv, w, owned, { hide:k });
  const P = pieceCanvas(w, k, cv.width, cv.height);
  const rect = cv.getBoundingClientRect(); const scale = rect.width / cv.width;
  const fx = $('#fxLayer'); const fc = fx.getContext('2d'); const d = Math.min(2, window.devicePixelRatio||1);
  const ex = rect.left + (P.x - P.m)*scale, ey = rect.top + (P.y - P.m)*scale, ew = P.cv.width*scale, eh = P.cv.height*scale;
  const sx = window.innerWidth/2 - ew*.8, sy = window.innerHeight*.62 - eh*.8;
  const o = { t:0 }; let hover = false;
  Sound.piece();
  uiFx.piece = { draw: () => { const t = o.t; let x, y, s, r;
      if (t < .45){ const p = easeOutBack(t/.45); x = sx; y = sy + (1-p)*120; s = 1.6*p; r = (1-p)*-.6 + Math.sin(t*20)*.03; }
      else { const p = easeInOut((t-.45)/.55); x = sx + (ex - sx)*p; y = sy + (ey - sy)*p - Math.sin(p*Math.PI)*80; s = 1.6 + (1-1.6)*p; r = 0; }
      if (hover){ const n = performance.now(); y += Math.sin(n*.004)*7; r = Math.sin(n*.003)*.05; }
      fc.save(); fc.translate((x+ew*s/2)*d,(y+eh*s/2)*d); fc.rotate(r); fc.globalAlpha = 1;
      fc.fillStyle = rgrad(fc,0,0,0,0,0,ew*s*d,[[0,'rgba(255,220,120,.45)'],[1,'rgba(255,220,120,0)']]); fc.fillRect(-ew*s*d,-eh*s*d,ew*s*2*d,eh*s*2*d);
      fc.drawImage(P.cv, -ew*s/2*d, -eh*s/2*d, ew*s*d, eh*s*d); fc.restore(); } };

  cv.parentElement.animate([{ transform:'scale(1)' },{ transform:'scale(1.03)' },{ transform:'scale(1)' }], { duration:300 });

async function completeWonder(w){

  const thumb = document.createElement('canvas'); thumb.width = 168; thumb.height = 126; const tc = thumb.getContext('2d');
  const pc = document.createElement('canvas'); pc.width = 336; pc.height = 252; drawPuzzle(pc, cur, ownedSet(cur,k), { complete: k>=PIECES_PER_WONDER }); tc.drawImage(pc,0,0,168,126);
  const nextIn = LEVELS_PER_PIECE - (completedLevels() % LEVELS_PER_PIECE);
  $('#panelCard').innerHTML = '';
  $('#panelCard').append(thumb);
  $('#panelCard').insertAdjacentHTML('beforeend', `<div><div class="meta">${all ? 'TÜM HARİKALAR TAMAMLANDI' : `ŞU ANKİ DURAK · ${W.country.toUpperCase()}`}</div><h2>${W.name}</h2>
    <div class="meta">${k}/${PIECES_PER_WONDER} parça${all?'':` · sonraki parçaya ${nextIn} bölüm`}</div><div class="pbar"><i style="width:${k/PIECES_PER_WONDER*100}%"></i></div></div>
    <div class="panelBtns">${all ? `<button class="btn" id="pPlay" disabled>Antik Dünya yakında</button>` : `<button class="btn" id="pPlay">▶ Bölüm ${(save.lvl-1)%LEVELS_PER_WONDER+1}</button>`}
    <button class="btn alt small" id="pPuzzle" aria-label="Puzzle">🧩</button><button class="btn alt small" id="pColl" aria-label="Koleksiyon">🏛</button></div>`);
  thumb.onclick = () => openPuzzle(cur);
  if (!all) $('#pPlay').onclick = () => openLevelIntro(save.lvl);
  $('#pPuzzle').onclick = () => openPuzzle(cur);
  $('#pColl').onclick = () => openCollection();
}
function wonderInfo(i){
  const W = WONDERS[i], done = wonderDone(i), cur = currentWonder(), k = piecesOf(i);
  openModal(`<div class="kicker">${W.place}, ${W.country}</div><h2>${W.name}</h2>
    <canvas class="thumb" id="mThumb" width="480" height="360"></canvas>
    ${done ? `<p>${W.fact}</p>` : i===cur ? `<p style="text-align:center;font-weight:800">${k}/${PIECES_PER_WONDER} parça toplandı. Her 5 bölümde bir yeni parça kazanırsın.</p>` : `<p style="text-align:center;font-weight:800">Bu harikaya ulaşmak için önce ${WONDERS[i-1].name} puzzle’ını tamamla.</p>`}
    <div class="row"><button class="btn ghost" id="mClose">Kapat</button>${i<=cur?`<button class="btn" id="mOpen">Puzzle’ı Gör</button>`:''}</div>`);
  const t = $('#mThumb').getContext('2d'); if (i <= cur){ const pc = document.createElement('canvas'); pc.width = 480; pc.height = 360; drawPuzzle(pc, i, ownedSet(i,k), { complete:done }); t.drawImage(pc,0,0); } else { t.filter = 'grayscale(1) brightness(.5) blur(3px)'; t.drawImage(sceneCanvas(W.id),0,0,480,360); t.filter = 'none'; t.fillStyle='#fff'; t.font='900 64px Nunito, sans-serif'; t.textAlign='center'; t.fillText('?',240,205); }
  $('#mClose').onclick = closeModal; const o = $('#mOpen'); if (o) o.onclick = () => { closeModal(); openPuzzle(i); };
}
function openCollection(){
  showScreen('collectionScreen'); const g = $('#collGrid'); g.innerHTML = '';
  WONDERS.forEach((W,i)=>{ const k = piecesOf(i), done = k>=PIECES_PER_WONDER, unlocked = i <= currentWonder();
    const b = document.createElement('button'); b.className = 'collCard' + (done?' done':''); const cv = document.createElement('canvas'); cv.width = 320; cv.height = 240;
    if (unlocked) drawPuzzle(cv, i, ownedSet(i,k), { complete:done }); else { const c = cv.getContext('2d'); c.fillStyle='#0d2236'; c.fillRect(0,0,320,240); c.globalAlpha=.25; c.drawImage(monumentIcon(W.id,208,192),56,24); }
    b.append(cv); b.insertAdjacentHTML('beforeend', `<b>${W.name}</b><span>${done ? '✦ Tamamlandı' : unlocked ? `${k}/${PIECES_PER_WONDER} parça` : '🔒 Kilitli'}</span>`);
    b.onclick = () => unlocked ? openPuzzle(i) : wonderInfo(i); g.append(b); });
  g.insertAdjacentHTML('beforeend', `<div class="collCard soon"><b>Antik Dünyanın 7 Harikası</b><span>Yeni dünya · yakında</span></div>`);
}

/* =====================================================================
   BÖLÜM GİRİŞİ, KARŞILAMA, AYARLAR

function openLevelIntro(g){
  Sound.ensure();
  if (g > TOTAL_LEVELS) return openMap();
  if (syncLives() <= 0) return noLivesModal();
  const L = makeLevel(g), W = WONDERS[L.w];
  const newTxt = L.introduces ? ({ block:()=>`Yeni engel: <b>${W.blocks.map(k=>BLOCKS[k].name).join(', ')}</b>. Yanında eşleşme yaparak kır.`, layer:()=>`Yeni engel: <b>${LAYERS[W.layer].name}</b>. Üzerindeki taşları eşleştirerek temizle.`, relic:()=>`Yeni görev: <b>${W.relic.name}</b>. Eseri tahtanın en altına indir.` })[L.primary]() : '';
  openModal(`<div class="kicker">${W.name} · ${W.country}</div><h2>Bölüm ${L.li}</h2>
    <canvas class="thumb" id="mThumb" width="480" height="360"></canvas>
    ${L.hard ? `<p style="text-align:center;margin:0 0 6px"><span class="hardTag">ZOR BÖLÜM</span> <b>Kazanırsan puzzle parçası senin!</b></p>` : ''}
    <p style="text-align:center;font-weight:800;margin:0 0 4px">Hedefler · ${L.moves} hamle</p>
    <div class="goalsRow">${L.goals.map(gl=>`<div class="goal" title="${goalLabel(gl,W)}"><img alt="" src="${goalIcon(gl,W)}">${gl.t==='score'?gl.n.toLocaleString('tr-TR'):gl.n}</div>`).join('')}</div>
    ${newTxt ? `<p style="text-align:center">${newTxt}</p>` : ''}
    ${L.sig ? `<p style="text-align:center;background:#fffaf0;border-radius:12px;padding:8px 10px">${L.sigIntro ? '<span class="hardTag" style="background:var(--terra)">YENİ MEKANİK</span><br>' : ''}<b>${SIGS[W.id].name}:</b> ${SIGS[W.id].desc}</p>` : ''}
    <p style="text-align:center;margin:6px 0 0;font-weight:800;font-size:22px;letter-spacing:4px" title="Canlar">${heartsHTML()}</p>
    <div class="row"><button class="btn ghost" id="mBack">Harita</button><button class="btn" id="mGo">Başla</button></div>`);
  const t = $('#mThumb').getContext('2d'); t.drawImage(sceneCanvas(W.id),0,0,480,360); t.fillStyle = grad(t,0,220,0,360,[[0,'rgba(0,0,0,0)'],[1,'rgba(0,0,0,.55)']]); t.fillRect(0,0,480,360);
  t.fillStyle='#fff'; t.font = '800 30px Cinzel, serif'; t.textAlign='left'; t.fillText(W.name, 22, 334);
  $('#mBack').onclick = () => { closeModal(); openMap(); };
  $('#mGo').onclick = () => { closeModal(); startLevel(g); };
}

    <div class="toggle" id="tCb"><span>Renk körü modu<small>Taşlara ek sembol koyar (●■▲✚◆★)</small></span>${sw(save.cb)}</div>
    <div class="toggle" id="tVib"><span>Titreşim<small>Özel güç ve ödüllerde (destekleyen cihazlarda)</small></span>${sw(save.vib)}</div>
    <div class="toggle" id="tPlay"><span>Oyuncu testi<small>Sonuçların ve kısa anket</small></span><b style="color:var(--ink)">Aç ›</b></div>

    ${save.test ? `<div class="toggle" id="tFill"><span>Test: canları doldur</span><b style="color:var(--ink)">Doldur</b></div>` : ''}
    ${save.test ? `<div class="toggle" id="tJump"><span>Test: parçaya atla<small>Bir sonraki bölümü kazanınca puzzle parçası gelir</small></span><b style="color:var(--ink)">Atla</b></div>` : ''}
    <div class="toggle" id="tReset"><span>İlerlemeyi sıfırla<small>Tüm bölümler ve koleksiyon silinir</small></span><b style="color:var(--bad)">Sıfırla</b></div>

  $('#tPlay').onclick = openPlaytest;

  $('#tVib').onclick = () => { save.vib = !save.vib; persist(); if (save.vib) vibrate(30); openSettings(); };
  $('#tTest').onclick = () => { save.test = !save.test; persist(); openSettings(); };
  const tfl = $('#tFill'); if (tfl) tfl.onclick = () => { save.lives = MAX_LIVES; save.lifeTs = null; persist(); openSettings(); };
  const tj = $('#tJump'); if (tj) tj.onclick = () => { if (save.lvl <= TOTAL_LEVELS){ save.lvl = Math.max(save.lvl, Math.ceil(save.lvl/LEVELS_PER_PIECE)*LEVELS_PER_PIECE); persist(); } closeModal(); openMap(); };
  $('#tReset').onclick = () => { openModal(`<h2>Emin misin?</h2><p style="text-align:center">Tüm ilerlemen silinecek.</p><div class="row"><button class="btn ghost" id="mNo">Vazgeç</button><button class="btn" id="mYes">Sıfırla</button></div>`);
    $('#mNo').onclick = openSettings; $('#mYes').onclick = () => { save = { lvl:1, stars:{}, sound:save.sound, test:save.test, seenIntro:true, lives:MAX_LIVES, lifeTs:null, decoSeen:0 }; persist(); closeModal(); openMap(); }; };
  $('#mClose').onclick = () => { closeModal(); renderPanel(); };
}

function openPlaytest(){
  const S = teleSummary(), fb = save.fb || {};
  const rate = (key, label, lo, hi) => `<div style="margin:8px 0"><div style="font-weight:800;font-size:14px">${label}</div><div style="display:flex;gap:6px;margin-top:4px">${[1,2,3,4,5].map(v=>`<button class="btn small ${fb[key]===v?'':'ghost'}" data-k="${key}" data-v="${v}" style="flex:1;padding:8px 0">${v}</button>`).join('')}</div><div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-weight:700"><span>${lo}</span><span>${hi}</span></div></div>`;
  const syncMsg = PT.state === 'ok' ? '✓ Sonuçların otomatik olarak oyunun sahibine iletiliyor.' : PT.state === 'ready' ? 'Sonuçların oyunun sahibine iletilecek.' : PT.state === 'err' ? 'Otomatik gönderim yapılamadı (yazma izni yok olabilir). Raporu kopyalayıp gönder.' : 'Bu görünümde otomatik gönderim yok. Raporu kopyalayıp gönder.';
  openModal(`<div class="kicker">Oyuncu testi</div><h2>Senin oyunun</h2>
    <div class="steps" style="grid-template-columns:1fr 1fr;display:grid">
      <div style="display:block"><b style="font-size:22px">${S.maxLevel}</b><br><small>ulaşılan bölüm</small></div>
      <div style="display:block"><b style="font-size:22px">${S.firstTryRate ?? '–'}%</b><br><small>ilk denemede kazanma</small></div>
      <div style="display:block"><b style="font-size:22px">${S.attempts}</b><br><small>deneme (${S.losses} kayıp, ${S.quits} çıkış)</small></div>
      <div style="display:block"><b style="font-size:22px">${S.avgSec ?? '–'} sn</b><br><small>ortalama bölüm süresi</small></div>
    </div>
    <h2 style="font-size:19px;margin-top:6px">Kısa anket</h2>
    ${rate('fun','Oyun ne kadar eğlenceli?','Hiç','Çok')}
    ${rate('diff','Bölümler ne kadar zordu?','Çok kolay','Çok zor')}
    ${rate('puzzle','Puzzle parçası seni oynamaya ne kadar teşvik etti?','Hiç','Çok')}
    ${rate('map','Harita ve koleksiyon ne kadar ilgini çekti?','Hiç','Çok')}
    <label for="fbBest" style="font-weight:800;font-size:14px">En çok neyi sevdin?</label>
    <textarea id="fbBest" rows="2" style="width:100%;border-radius:10px;border:1px solid #d6ccb6;padding:8px;font:inherit;margin:4px 0 8px;background:#fffaf0;color:var(--text)">${fb.best||''}</textarea>
    <label for="fbWorst" style="font-weight:800;font-size:14px">Neyin değişmesini isterdin?</label>
    <textarea id="fbWorst" rows="2" style="width:100%;border-radius:10px;border:1px solid #d6ccb6;padding:8px;font:inherit;margin:4px 0 8px;background:#fffaf0;color:var(--text)">${fb.worst||''}</textarea>
    <button class="btn wide" id="fbSave">Anketi Kaydet</button>
    <p style="font-size:12px;color:var(--muted);text-align:center;margin:8px 0">${syncMsg}<br>İsim kaydedilmez; yalnızca bölüm sonuçları, süreler ve anket cevapları paylaşılır.</p>
    <div class="row"><button class="btn ghost" id="fbCopy">Raporu Kopyala</button>${PT.owner ? '<button class="btn alt" id="fbAll">Tüm Testçiler</button>' : ''}</div>
    <button class="btn ghost wide" id="mClose" style="margin-top:10px">Kapat</button>
    <textarea id="fbReport" readonly hidden rows="6" style="width:100%;margin-top:8px;font-size:11px"></textarea>`);
  const draft = { ...fb };
  document.querySelectorAll('[data-k]').forEach(b=>b.onclick = () => { draft[b.dataset.k] = +b.dataset.v; document.querySelectorAll(`[data-k="${b.dataset.k}"]`).forEach(x=>x.classList.toggle('ghost', +x.dataset.v !== draft[b.dataset.k])); });
  $('#fbSave').onclick = () => { draft.best = $('#fbBest').value.slice(0,500); draft.worst = $('#fbWorst').value.slice(0,500); draft.ts = Date.now(); save.fb = draft; save.fbAsked = true; persist(); queueSync(); $('#fbSave').textContent = 'Kaydedildi ✓'; };
  $('#fbCopy').onclick = async () => { const t = reportText(); try { await navigator.clipboard.writeText(t); $('#fbCopy').textContent = 'Kopyalandı ✓'; } catch(e){ const ta = $('#fbReport'); ta.hidden = false; ta.value = t; ta.select(); $('#fbCopy').textContent = 'Metni seçip kopyala'; } };
  const all = $('#fbAll'); if (all) all.onclick = openAllTesters;
  $('#mClose').onclick = closeModal;
}
async function openAllTesters(){
  openModal(`<div class="kicker">Oyunun sahibi</div><h2>Tüm testçiler</h2><p style="text-align:center" id="atBody">Yükleniyor…</p><button class="btn ghost wide" id="mBack2">Geri</button>`);
  $('#mBack2').onclick = openPlaytest;
  const to = setTimeout(()=>{ const b = $('#atBody'); if (b && b.textContent === 'Yükleniyor…') b.textContent = 'Sonuçlar alınamadı. Daha sonra tekrar dene.'; }, 10000);
  try {
    const snap = await PT.db.collection('playtests').get(); clearTimeout(to);
    const rows = snap.docs.map(d=>d.data()).filter(Boolean);
    if (!rows.length){ $('#atBody').textContent = 'Henüz sonuç yok. Linki testçilerle paylaştığında sonuçlar burada görünür.'; return; }
    const all = rows.flatMap(r=>Array.isArray(r.attempts) ? r.attempts : []); const S = teleSummary(all);
    const fbs = rows.map(r=>r.fb).filter(f=>f && typeof f === 'object'); const avg = k => { const v = fbs.map(f=>+f[k]).filter(x=>x>=1&&x<=5); return v.length ? (v.reduce((a,b)=>a+b,0)/v.length).toFixed(1) : '–'; };
    const byType = {}; all.filter(a=>a.r!=='quit').forEach(a=>{ const k = a.sig ? 'imza' : a.t; byType[k] = byType[k] || [0,0]; byType[k][1]++; if (a.r==='win') byType[k][0]++; });
    const esc = t => String(t).replace(/[&<>"]/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
    $('#atBody').outerHTML = `<div style="text-align:left;font-size:14px;line-height:1.6">
      <p><b>${rows.length}</b> testçi · <b>${S.attempts}</b> deneme · ilk denemede kazanma <b>${S.firstTryRate ?? '–'}%</b> · ort. süre <b>${S.avgSec ?? '–'} sn</b></p>
      <p>Anket ortalaması (${fbs.length} kişi): eğlence <b>${avg('fun')}</b> · zorluk <b>${avg('diff')}</b> · puzzle <b>${avg('puzzle')}</b> · harita <b>${avg('map')}</b></p>
      <p>Hedef tipine göre kazanma: ${Object.entries(byType).map(([k,[w,n]])=>`${k} <b>${Math.round(w/n*100)}%</b> (${n})`).join(' · ')}</p>
      <p>Ulaşılan bölümler: ${rows.map(r=>r.lvl ? r.lvl-1 : 0).sort((a,b)=>b-a).join(', ')}</p>
      ${fbs.filter(f=>f.best||f.worst).slice(0,12).map(f=>`<div style="background:#fffaf0;border-radius:10px;padding:8px;margin:6px 0">${f.best?`👍 ${esc(f.best)}<br>`:''}${f.worst?`✎ ${esc(f.worst)}`:''}</div>`).join('')}</div>`;
  } catch(e){ clearTimeout(to); const b = $('#atBody'); if (b) b.textContent = 'Sonuçlar alınamadı. Daha sonra tekrar dene.'; }
}
/* ---- ekran / modal ---- */
function showScreen(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active', s.id===id)); }
function openModal(html){ $('#modalCard').innerHTML = html; $('#modal').hidden = false; $('#modalCard').style.animation = 'none'; void $('#modalCard').offsetWidth; $('#modalCard').style.animation = ''; }
function closeModal(){ $('#modal').hidden = true; }
$('#btnSettings').onclick = openSettings;
$('#btnQuit').onclick = () => { if (!G || G.over) return; const costs = !G.over && G.moves < G.L.moves;
  openModal(`<h2>Bölümden çık?</h2><p style="text-align:center">${costs ? '<b>1 can kaybedeceksin.</b> ' : ''}Bu bölümdeki ilerlemen kaydedilmez.</p><div class="row"><button class="btn ghost" id="mStay">Oyuna Dön</button><button class="btn" id="mLeave">Haritaya Dön</button></div>`);
  $('#mStay').onclick = closeModal; $('#mLeave').onclick = () => { if (costs){ logAttempt('quit'); loseLife(); } closeModal(); openMap(); }; };
$('#btnPuzzleBack').onclick = () => openMap();
$('#btnCollBack').onclick = () => openMap();

/* ---- UI efekt katmanı (konfeti, uçan parça) ---- */
const fxCv = $('#fxLayer'), fxc = fxCv.getContext('2d'); const confettiP = []; const uiFx = {};
function sizeFx(){ const d = Math.min(2, window.devicePixelRatio||1); fxCv.width = window.innerWidth*d; fxCv.height = window.innerHeight*d; fxCv.style.width = window.innerWidth+'px'; fxCv.style.height = window.innerHeight+'px'; }
function confetti(x, y, n, cols=['#ffd45a','#d4233a','#2f6fd6','#2fa36b','#d0632e','#fff']){ for (let i=0;i<n;i++){ const a = Math.random()*TAU, v = 2 + Math.random()*7; confettiP.push({ x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v - 4, r:Math.random()*TAU, vr:(Math.random()-.5)*.3, w:5+Math.random()*6, h:3+Math.random()*4, c:cols[i%cols.length], life:0 }); } }
function renderFx(dt){
  const d = Math.min(2, window.devicePixelRatio||1); fxc.setTransform(1,0,0,1,0,0); fxc.clearRect(0,0,fxCv.width,fxCv.height);
  Object.values(uiFx).forEach(f=>f && f.draw());
  fxc.setTransform(d,0,0,d,0,0);
  for (let i=confettiP.length-1;i>=0;i--){ const p = confettiP[i]; p.life += dt; p.x += p.vx*dt/16; p.y += p.vy*dt/16; p.vy += .18*dt/16; p.vx *= .99; p.r += p.vr;
    fxc.save(); fxc.translate(p.x,p.y); fxc.rotate(p.r); fxc.globalAlpha = Math.max(0, 1 - p.life/2200); fxc.fillStyle = p.c; fxc.fillRect(-p.w/2,-p.h/2,p.w,p.h); fxc.restore();
    if (p.life > 2200 || p.y > window.innerHeight + 40) confettiP.splice(i,1); }
}

/* ---- ana döngü ---- */
let last = performance.now();
function frame(now){
  const dt = Math.min(50, now - last); last = now;
  stepTweens(dt); stepFx(dt);
  if (G && $('#gameScreen').classList.contains('active')){
    renderBoard(now);
    if (!G.busy && !G.over){ G.idle += dt; if (G.idle > 5000 && !G.hint) G.hint = findMove(); }
  }
  renderFx(dt);
  requestAnimationFrame(frame);
}
window.addEventListener('resize', ()=>{ sizeFx(); if (G){ layoutBoard(); boardTex = null; } if ($('#mapScreen').classList.contains('active')) applyCam(); if ($('#puzzleScreen').classList.contains('active')) openPuzzle(pzView.w); });
sizeFx();
requestAnimationFrame(frame);
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(()=>{ spriteCache.clear(); });
openMap();
</script>
