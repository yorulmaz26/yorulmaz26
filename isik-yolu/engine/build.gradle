plugins {
    id 'java-library'
}

// Saf Java bulmaca motoru: Android'e bağımlı değildir, masaüstü JVM'de test edilir.
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

def levelsFile = rootProject.file('app/src/main/assets/levels.json')

test {
    systemProperty 'levels.file', levelsFile.absolutePath
    systemProperty 'file.encoding', 'UTF-8'
    maxHeapSize = '2g'
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat 'full'
        showStandardStreams = true
    }
}

// ./gradlew :engine:generateLevels -Pfrom=1 -Pto=100
tasks.register('generateLevels', JavaExec) {
    group = 'ışık yolu'
    description = 'Bölümleri üretir, çözücüyle doğrular ve app/src/main/assets/levels.json dosyasına yazar.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.isikyolu.engine.tools.GenerateLevels'
    args levelsFile.absolutePath, (project.findProperty('from') ?: '1'), (project.findProperty('to') ?: '100')
    jvmArgs '-Dstdout.encoding=UTF-8', '-Xmx2g'
}
