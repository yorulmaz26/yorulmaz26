plugins {
    id 'com.android.application'
}

// AdMob kimlikleri. Google'ın resmi TEST kimlikleri varsayılandır (gerçek gelir getirmez).
// Kendi kimliklerin için ~/.gradle/gradle.properties ya da gradle.properties dosyasına yaz:
//   admobAppId=ca-app-pub-XXXX~YYYY   admobBanner=ca-app-pub-XXXX/1   admobInterstitial=...   admobRewarded=...
// Debug derlemesi her zaman test kimliklerini kullanır (kendi reklamına tıklamak AdMob kurallarına aykırıdır).
def TEST_ADS = [
        admobAppId       : 'ca-app-pub-3940256099942544~3347511713',
        admobBanner      : 'ca-app-pub-3940256099942544/9214589741',
        admobInterstitial: 'ca-app-pub-3940256099942544/1033173712',
        admobRewarded    : 'ca-app-pub-3940256099942544/5224354917',
]
def realAdKeys = TEST_ADS.keySet().findAll { project.hasProperty(it) && project.property(it).toString().trim() }
if (!realAdKeys.isEmpty() && realAdKeys.size() != TEST_ADS.size())
    throw new GradleException("AdMob kimlikleri eksik: ${TEST_ADS.keySet() - realAdKeys} (dördü birlikte verilmeli; hiçbiri verilmezse test kimlikleri kullanılır)")
def adId = { String key, boolean release -> release && !realAdKeys.isEmpty() ? project.property(key).toString().trim() : TEST_ADS[key] }
// Gizlilik politikası adresi (Play Console'a da girilir): privacyPolicyUrl=https://...
def privacyUrl = project.hasProperty('privacyPolicyUrl') ? project.property('privacyPolicyUrl').toString().trim() : ''

android {
    namespace 'com.isikyolu.game'
    compileSdk 36

    defaultConfig {
        applicationId 'com.isikyolu.game'
        minSdk 26
        targetSdk 36
        versionCode 10
        versionName '1.7.0'
    }

    buildFeatures { buildConfig true }
    defaultConfig.buildConfigField 'String', 'PRIVACY_URL', "\"${privacyUrl}\""

    signingConfigs {
        // Yerel test dağıtımı için sürüm APK'sı da imzalanır (keystore depoya konmaz, debug anahtarı kullanılır).
        release {
            storeFile file(System.getProperty('user.home') + '/.android/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            manifestPlaceholders = [admobAppId: adId('admobAppId', false)]
            buildConfigField 'String', 'AD_BANNER', "\"${adId('admobBanner', false)}\""
            buildConfigField 'String', 'AD_INTERSTITIAL', "\"${adId('admobInterstitial', false)}\""
            buildConfigField 'String', 'AD_REWARDED', "\"${adId('admobRewarded', false)}\""
            buildConfigField 'boolean', 'AD_TEST_IDS', 'true'
        }
        release {
            manifestPlaceholders = [admobAppId: adId('admobAppId', true)]
            buildConfigField 'String', 'AD_BANNER', "\"${adId('admobBanner', true)}\""
            buildConfigField 'String', 'AD_INTERSTITIAL', "\"${adId('admobInterstitial', true)}\""
            buildConfigField 'String', 'AD_REWARDED', "\"${adId('admobRewarded', true)}\""
            buildConfigField 'boolean', 'AD_TEST_IDS', "${realAdKeys.isEmpty()}"
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs.release.storeFile.exists()) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                maxHeapSize = '2g'
                systemProperty 'screens.dir', rootProject.file('docs/ekranlar').absolutePath
                if (project.hasProperty('promoDir')) systemProperty 'promo.dir', project.property('promoDir').toString()
                testLogging { events 'passed', 'failed'; exceptionFormat 'full'; showStandardStreams = true }
            }
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation project(':engine')
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'

}
