plugins {
    id 'com.android.application'
}

android {
    namespace 'com.isikyolu.game'
    compileSdk 34
    buildToolsVersion '34.0.0'

    defaultConfig {
        applicationId 'com.isikyolu.game'
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName '1.3.0'
    }

    signingConfigs {
        // Yerel test dağıtımı için sürüm APK'sı da imzalanır (keystore depoya konmaz, debug anahtarı kullanılır).
        release {
            storeFile file(System.getProperty('user.home') + '/.android/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs.release.storeFile.exists()) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                maxHeapSize = '2g'
                systemProperty 'screens.dir', rootProject.file('docs/ekranlar').absolutePath
                testLogging { events 'passed', 'failed'; exceptionFormat 'full'; showStandardStreams = true }
            }
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation project(':engine')
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'

}
