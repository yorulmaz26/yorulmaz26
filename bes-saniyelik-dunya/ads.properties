# Reklam ayarları (AdMob). Bu dosyadaki kimlikler gizli değildir; uygulamanın içine yazılır.
#
# 1) Aşağıdaki üç satır Google'ın resmi DENEME kimlikleridir. Bunlarla uygulama yalnızca "Test Ad" etiketli
#    deneme reklamı gösterir; tıklamak serbesttir ama gelir oluşmaz.
# 2) Yayına çıkmadan önce AdMob hesabınızdaki GERÇEK kimlikleri yazın (docs/play_store/REKLAM_REHBERI.md):
#    AdMob > Uygulamalar > uygulamanız > Uygulama ayarları: uygulama kimliği (ca-app-pub-...~...)
#    AdMob > Reklam birimleri: "Ödüllü" ve "Geçiş" birimlerinin kimlikleri (ca-app-pub-.../...)
# 3) Gerçek kimliklerle kendi telefonunuzda denerken ASLA kendi reklamlarınıza tıklamayın; telefonunuzu
#    AdMob > Ayarlar > Test cihazları bölümüne ekleyin ya da kimliğini testDeviceIds satırına yazın.
admobAppId=ca-app-pub-3940256099942544~3347511713
rewardedUnitId=ca-app-pub-3940256099942544/5224354917
interstitialUnitId=ca-app-pub-3940256099942544/1033173712

# Hedef kitle; Play Console'daki "Hedef kitle" beyanınızla AYNI olmalı:
#   child   = kitlede 13 yaş altı da var (ya da emin değilsiniz). Reklamlar çocuklara uygun (G), kişiselleştirilmez,
#             reklam kimliği izni pakete girmez. Güvenli seçenek; gelir biraz daha düşüktür.
#   general = yalnızca 13 yaş ve üstü. Kişiselleştirilmiş reklam (onay gereken ülkelerde onayla), içerik sınırı PG.
audience=child

# Geçiş reklamları (bölüm bitince, seyrek gösterilen tam ekran reklam): on / off.
# off yapılırsa yalnızca oyuncunun kendi isteğiyle izlediği ödüllü reklamlar kalır.
interstitials=on

# İsteğe bağlı: virgülle ayrılmış test cihazı kimlikleri (ilk reklam isteğinde logcat'te yazar).
testDeviceIds=
