name: Zamanın Efendisi

on:
  push:
    paths:
      - "zamanin-efendisi/**"
      - ".github/workflows/zamanin-efendisi.yml"
  pull_request:
    paths:
      - "zamanin-efendisi/**"
  workflow_dispatch:

concurrency:
  group: zaman-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Mantık testleri + Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: zamanin-efendisi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Oyun mantığı testleri (nedensellik, bölüm çözülebilirliği, kayıt, canlar)
        run: ./gradlew :logic:test --stacktrace
      - name: Debug APK
        run: ./gradlew :android:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: zamanin-efendisi-debug-apk
          path: zamanin-efendisi/android/build/outputs/apk/debug/*.apk
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zamanin-efendisi-test-raporu
          path: zamanin-efendisi/logic/build/reports/tests
          if-no-files-found: ignore
