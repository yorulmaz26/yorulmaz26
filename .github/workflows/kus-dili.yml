name: Kuş Dili

on:
  push:
    paths: ['kus_dili/**', '.github/workflows/kus-dili.yml']
  pull_request:
    paths: ['kus_dili/**', '.github/workflows/kus-dili.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - name: Motor — analiz ve testler
        working-directory: kus_dili/packages/kus_dili_engine
        run: |
          dart pub get
          dart format --output=none --set-exit-if-changed lib test
          dart analyze --fatal-infos
          dart test

      - name: Uygulama — analiz ve testler
        working-directory: kus_dili
        run: |
          flutter pub get
          flutter analyze
          flutter test

  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kus_dili/firebase/rules-test/package-lock.json
      - name: Güvenlik kuralı testleri (Emulator Suite)
        working-directory: kus_dili/firebase/rules-test
        run: |
          npm ci
          npm test

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kus_dili/functions/package-lock.json
      - name: Cloud Functions — derleme ve birim testleri
        working-directory: kus_dili/functions
        run: |
          npm ci
          npm test

  android-build:
    # Yerel yapılandırmayı (izinler, eklentiler, R8 kuralları) doğrular.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true
      - name: Firebase yapılandırması (KUSDILI_GOOGLE_SERVICES_JSON gizlisi varsa)
        # Depodaki başka uygulamanın GOOGLE_SERVICES_JSON gizlisiyle karışmasın
        # diye ayrı ad kullanılır; dosyada bu uygulamanın paketi yoksa atlanır.
        working-directory: kus_dili
        env:
          GS: ${{ secrets.KUSDILI_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GS" ]; then
            echo "::warning::KUSDILI_GOOGLE_SERVICES_JSON yok; APK çevrimdışı açılır."
          elif printf '%s' "$GS" | jq -e '[.client[].client_info.android_client_info.package_name] | index("com.kusdili.kus_dili")' >/dev/null; then
            printf '%s' "$GS" > android/app/google-services.json
            echo "Firebase'e bağlı APK derleniyor."
          else
            echo "::warning::KUSDILI_GOOGLE_SERVICES_JSON içinde com.kusdili.kus_dili yok; APK çevrimdışı açılır."
          fi
      - name: APK (debug + küçültülmüş release)
        working-directory: kus_dili
        run: |
          flutter pub get
          flutter build apk --debug
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: kus-dili-apk
          path: kus_dili/build/app/outputs/flutter-apk/*.apk
          retention-days: 7

  ios-build:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true
      - name: iOS (imzasız)
        working-directory: kus_dili
        run: |
          flutter pub get
          flutter build ios --release --no-codesign
