name: Kuş Dili

on:
  push:
    paths: ['kus_dili/**', '.github/workflows/kus-dili.yml']
  pull_request:
    paths: ['kus_dili/**', '.github/workflows/kus-dili.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - name: Motor — analiz ve testler
        working-directory: kus_dili/packages/kus_dili_engine
        run: |
          dart pub get
          dart format --output=none --set-exit-if-changed lib test
          dart analyze --fatal-infos
          dart test

      - name: Uygulama — analiz ve testler
        working-directory: kus_dili
        run: |
          flutter pub get
          flutter analyze
          flutter test
