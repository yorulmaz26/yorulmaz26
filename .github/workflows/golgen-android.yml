name: Gölgen Seni Yakalamasın (Android)

on:
  push:
    paths:
      - "golgen-seni-yakalamasin/**"
      - ".github/workflows/golgen-android.yml"
  workflow_dispatch:

concurrency:
  group: golgen-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: golgen-seni-yakalamasin

jobs:
  build:
    name: Derleme + birim testleri + APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Birim testleri, lint, debug ve release APK
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease --stacktrace
      - name: APK dosyalarını adlandır
        run: |
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/GolgenSeniYakalamasin-debug.apk
          cp app/build/outputs/apk/release/app-release.apk ../dist/GolgenSeniYakalamasin.apk
          ls -la ../dist
          echo "### APK boyutları" >> $GITHUB_STEP_SUMMARY
          ls -la ../dist | tail -n +2 >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: golgen-apk
          path: dist/*.apk
          retention-days: 30
      - name: Test ve lint raporları
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golgen-raporlar
          path: |
            golgen-seni-yakalamasin/app/build/reports
            golgen-seni-yakalamasin/app/build/test-results
          if-no-files-found: ignore

  ui-test:
    name: Emülatörde uçtan uca UI testi
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: golgen-apk
          path: dist
      - name: KVM erişimi
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emülatör (API 34, Pixel 6) üzerinde test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash golgen-seni-yakalamasin/tools/smoke_test.sh dist/GolgenSeniYakalamasin-debug.apk ui-test-out
      - name: Ekran görüntülerini günlüğe yaz
        if: always()
        working-directory: .
        run: bash golgen-seni-yakalamasin/tools/print_screens.sh ui-test-out/ekranlar
      - name: Test sonuçları
        if: always()
        working-directory: .
        run: |
          echo "### UI test sonuçları" >> $GITHUB_STEP_SUMMARY
          cat ui-test-out/test_sonuclari.txt >> $GITHUB_STEP_SUMMARY || true
          echo "----- logcat hataları -----"
          grep -E "AndroidRuntime|FATAL|golgen" ui-test-out/logcat.txt | grep -v GolgenUI | tail -40 || true
          echo "----- son ekran olayları -----"
          grep "GolgenUI" ui-test-out/logcat.txt | grep -v hedef | tail -15 || true
          echo "----- FPS -----"
          cat ui-test-out/fps.txt || true
          echo "----- SONUÇLAR -----"
          cat ui-test-out/test_sonuclari.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golgen-ui-test
          path: ui-test-out
          retention-days: 30

  release:
    name: APK'yı GitHub Releases'a yükle
    needs: [build, ui-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: golgen-apk
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: golgen-v1.0.0-b${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: "Gölgen Seni Yakalamasın 1.0.0 (derleme ${{ github.run_number }})"
          prerelease: true
          body: |
            Otomatik derlenmiş Android APK.
            - `GolgenSeniYakalamasin.apk`: küçültülmüş (R8) sürüm, Android 8.0+ (debug anahtarıyla imzalı; doğrudan kurulabilir).
            - `GolgenSeniYakalamasin-debug.apk`: hata ayıklama sürümü.
          files: dist/*.apk
