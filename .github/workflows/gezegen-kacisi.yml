name: Gezegen Kaçışı APK

on:
  push:
    paths:
      - "GezegenKacisi/**"
      - ".github/workflows/gezegen-kacisi.yml"
  workflow_dispatch:

concurrency:
  group: gezegen-kacisi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Oyun APK derlemesi
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: GezegenKacisi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: APK'yı indirilebilir yap
        uses: actions/upload-artifact@v4
        with:
          name: gezegen-kacisi-debug-apk
          path: GezegenKacisi/app/build/outputs/apk/debug/*.apk
          retention-days: 30
