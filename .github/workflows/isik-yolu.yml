name: Işık Yolu

on:
  push:
    paths:
      - 'isik-yolu/**'
      - '.github/workflows/isik-yolu.yml'
  pull_request:
    paths:
      - 'isik-yolu/**'
  workflow_dispatch:

concurrency:
  group: isik-yolu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Motor testleri, arayüz testleri ve APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: isik-yolu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test imza anahtarı (yoksa oluştur)
        run: |
          mkdir -p ~/.android
          [ -f ~/.android/debug.keystore ] || keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Motor testleri (100 bölüm çözülebilirlik dahil)
        run: ./gradlew :engine:test --stacktrace
      - name: APK derleme (debug + release)
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace
      - name: Arayüz testleri (Robolectric, 100 bölüm dokunarak)
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: APK
        uses: actions/upload-artifact@v4
        with:
          name: isik-yolu-apk
          path: isik-yolu/app/build/outputs/apk/**/*.apk
          retention-days: 30
      - name: Test raporları ve ekran görüntüleri
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isik-yolu-test-raporlari
          path: |
            isik-yolu/engine/build/reports/tests
            isik-yolu/app/build/reports/tests
            isik-yolu/docs/ekranlar
          if-no-files-found: ignore
